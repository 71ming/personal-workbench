# 个人工作台 · 桌面版（Tauri 2）
#
# 这个工程的定位：把原来「Node 服务 + 浏览器」的形态，
# 换成一个有图标、双击就能开、不弹黑色命令行窗口的桌面软件。
#
# 关键设计（改动前务必先读 http_server.rs 里的说明）：
#   窗口加载的是 http://127.0.0.1:端口，不是文件。
#   所以 public/index.html 里那些 fetch('/api/xxx') 的相对路径原样能用，
#   **前端一行都不用改**。

[package]
name = "workbench"
version = "0.6.1"
description = "个人工作台"
authors = ["you"]
edition = "2021"

# Tauri 2 在 Windows/macOS/Linux 上都要求这几个 crate 类型。
# mobile 那行是给将来的 Android/iOS 留的，现在用不上，但加上不影响桌面构建。
[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库。bundled 这个 feature 的意思是：把 SQLite 源码直接编译进我们的 exe，
# 不依赖电脑上有没有装 SQLite，也不需要装任何运行时。
# —— 这一条保住了「拷到哪台电脑都能直接跑」这个特性。
rusqlite = { version = "0.40", features = ["bundled"] }

# 极简 HTTP 服务端。同步模型、没有 async，配上同步的 rusqlite 正好。
# 没有用 axum 那类异步框架，是因为这个应用是「一个人本地用」，
# 并发极低，同步模型最简单也最不容易写错。
tiny_http = "0.12"

# 抓网页（阶段 1c）。server.js 用的是 Node 自带的 fetch，Rust 没有，
# 只能引一个 HTTP 客户端。
#
# 为什么选 reqwest 而不是 ureq：
#   reqwest 支持**手动处理重定向**（每跳一次重新验一次是不是内网地址），
#   这条是安全要求，不是优化 —— 见 fetch.rs 里的说明。
#   ureq 默认自动跟重定向，中间的地址看不见，就没地方插检查。
#
# 为什么用 blocking 而不是 async：
#   这个 HTTP 服务端（tiny_http）是**同步**的，数据层（rusqlite）也是同步的。
#   要用 async 的 reqwest，就得把整个服务改成异步 —— 加一个运行时、
#   把所有数据层函数包进 async、把 tiny_http 换成别的东西。
#   代价是一整套结构改造，换来的好处是「抓网页时不阻塞别的请求」。
#
#   但这个应用是「一个人本地用」，并发极低。抓网页最多 8 秒，
#   这 8 秒里唯一会来的请求就是用户点的那个「重新抓取」本身。
#   **为一个人的应用引入异步运行时，是拿架构整洁换实际收益为零。**
#   （真要并发，抓取那一段该丢进后台线程池，接口立即返回「正在抓」——
#    那是另一件事，且前端现在也没有这个交互。）
#
# blocking feature 会带一个额外的依赖和一点点线程开销，
# 换的是整份代码不用改结构。划算。
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "default-tls",   # 用系统自带的 TLS（Windows: Schannel），不打包 OpenSSL
  "gzip",
  "charset",
  "http2",
] }

# ---------------------------------------------------------------------------
# 自动更新（阶段 3）
#
# 为什么只用这一个插件：重启应用不需要 tauri-plugin-process，
# Rust 侧 app.restart() 就够了（那是 Tauri 核心的能力，不是插件）。
#
# 关键约束：这个界面**拿不到 Tauri 的 IPC**（withGlobalTauri = false，
# 而且窗口加载的是 http://127.0.0.1，不是 tauri:// 协议）。
# 所以官方文档里那段前端调 @tauri-apps/plugin-updater 的写法在这里用不了，
# 只能由 Rust 侧用 AppHandle 调，再包成两个本地 HTTP 接口给界面。
# 详见 update.rs 顶部。
# ---------------------------------------------------------------------------
tauri-plugin-updater = "2"

# ---------------------------------------------------------------------------
# 发布版体积优化
# Tauri 的卖点就是比 Electron 小，这些开关直接决定安装包大小。
# 实测参考：一个带 SQLite 的 Tauri 应用，开满这套约 6-10MB；
# 不开这套（默认）可能到 20MB 以上。
# ---------------------------------------------------------------------------
[profile.release]
opt-level = "z"     # "z" 偏体积，"3" 偏速度。桌面小工具选体积。
lto = true           # 链接时优化，跨模块裁掉没用的代码
codegen-units = 1   # 只用一个编译单元，优化效果最好（编译慢一点）
strip = true         # 剥掉调试符号，能省好几 MB
panic = "abort"     # panic 直接终止，不展开栈
