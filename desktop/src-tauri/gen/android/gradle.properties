# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# 关掉「项目路径里有非 ASCII 字符就不许构建」这项检查。
#
# 为什么必须关：项目在 E:\个人工作台\，路径含中文，
# 而 Android Gradle 插件默认**拒绝**这种情况 —— 它不是猜测，是直接抛异常停工：
#   Failed to apply plugin 'com.android.internal.application'.
#   > Your project path contains non-ASCII characters.
#
# 官方给的开关就是这个（报错信息里点名让加这一行）。
#
# ⚠️ 它只是**关掉检查**，不保证中文路径真的没问题 —— 官方原话是
# "This will most likely cause the build to fail on Windows"。
# 所以这是个**先试后说**的开关：加上去能编过就留着；
# 万一后面某一步报出看不懂的路径错误，第一个要怀疑的就是它，
# 那时改成「在纯英文目录下构建、把 APK 复制回来」才是正解。
android.overridePathCheck=true

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# 关掉 Kotlin 增量编译。
#
# 为什么必须关：开启增量编译时，Kotlin 会把「类名 ↔ 源文件」的对照表写成
# 一堆 .tab 二进制缓存；构建结束时关这些文件会失败，整个构建就挂在这一步：
#   e: Daemon compilation failed: null
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# 关掉之后 Kotlin 每次都整份重编，不写这些缓存。
# 代价只是首次构建多花一两分钟，之后一样走 gradle 的构建缓存；
# 换来的是在中文路径 + Windows 上少一个说不清道不明的随机失败点。
kotlin.incremental=false
