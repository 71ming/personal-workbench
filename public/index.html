<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人工作台</title>
<style>
  /* ==========================================================
     个人工作台 · 样式
     设计原则：白底 + 一个主色，靠留白和层次说话，不堆装饰。
     ========================================================== */

  /* ---------- 设计变量：改这里就能整体换配色 ---------- */
  :root {
    --bg:          #f5f6f8;   /* 页面底色 */
    --surface:     #ffffff;   /* 卡片/面板底色 */
    --border:      #e8eaed;   /* 分隔线 */
    --border-soft: #f0f1f4;
    --text:        #1a1d21;   /* 主文字 */
    --text-sub:    #656b73;   /* 次要文字 */
    --text-mute:   #9aa1a9;   /* 更淡的说明文字 */
    --accent:      #4f6ef7;   /* 主色 */
    --accent-soft: #eef1ff;   /* 主色的浅底 */
    --danger:      #e5484d;
    --ok:          #30a46c;
    --warn:        #f5a524;
    --radius:      10px;
    --shadow:      0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* 细一点的滚动条，别抢视线 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #d6d9de; border-radius: 6px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #bcc1c8; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* 键盘操作时才显示聚焦圈，鼠标点击不显示 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ================= 顶部 ================= */
  header {
    display: flex; align-items: center; gap: 20px;
    height: 56px; padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #6d8bff, var(--accent));
    display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }

  /* 搜索框 */
  .search-wrap { position: relative; flex: 1; max-width: 460px; }
  .search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--text-mute); pointer-events: none;
  }
  #search {
    width: 100%; padding: 8px 12px 8px 34px;
    font-size: 13.5px; font-family: inherit; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #fafbfc; outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  #search::placeholder { color: var(--text-mute); }
  #search:focus {
    border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(79,110,247,.12);
  }
  #search::-webkit-search-cancel-button { cursor: pointer; }

  /* ================= 主体两栏 ================= */
  main { flex: 1; display: flex; min-height: 0; }

  /* ---------- 左侧列表 ---------- */
  #sidebar {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  #note-list { flex: 1; overflow-y: auto; padding: 8px; }

  .item {
    position: relative;
    padding: 10px 12px; margin-bottom: 2px;
    border-radius: var(--radius); cursor: pointer;
    transition: background .12s;
  }
  .item:hover { background: #f6f7f9; }
  .item.active { background: var(--accent-soft); }
  /* 选中项左侧一道主色竖条 */
  .item.active::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }

  .item-head { display: flex; align-items: baseline; gap: 8px; }
  .item .t {
    flex: 1; min-width: 0; font-weight: 600; font-size: 14px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item.active .t { color: var(--accent); }
  .item .d { flex-shrink: 0; font-size: 11.5px; color: var(--text-mute); }
  /* 正文摘要，最多两行 */
  .item .snippet {
    margin-top: 3px; font-size: 12.5px; line-height: 1.5; color: var(--text-sub);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .item .snippet:empty { display: none; }

  /* 列表为空时的占位 */
  .empty {
    padding: 48px 20px; text-align: center; color: var(--text-mute);
  }
  .empty svg { width: 34px; height: 34px; margin-bottom: 10px; opacity: .45; }
  .empty p { margin: 0; font-size: 13px; }

  /* 新建按钮 */
  .sidebar-foot { padding: 10px 12px; border-top: 1px solid var(--border-soft); }
  #new-note {
    width: 100%; padding: 9px; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer; color: var(--text);
    border: 1px dashed #d3d7dd; border-radius: var(--radius);
    background: transparent;
    transition: all .15s;
  }
  #new-note:hover {
    border-style: solid; border-color: var(--accent);
    color: var(--accent); background: var(--accent-soft);
  }

  /* ---------- 右侧编辑器 ---------- */
  #editor { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }

  #editor-head {
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  /* 保存状态做成小药丸，用颜色告诉你状态 */
  #save-state {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto; padding: 4px 10px;
    font-size: 12px; color: var(--text-sub);
    background: #f4f5f7; border-radius: 999px;
    transition: background .2s, color .2s;
  }
  #save-state::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-mute); transition: background .2s;
  }
  #save-state.saving { background: #fff6e6; color: #a16207; }
  #save-state.saving::before { background: var(--warn); }
  #save-state.saved  { background: #eaf7f0; color: #1a7f4f; }
  #save-state.saved::before { background: var(--ok); }
  /* 保存失败：变红，并且点它可以手动重试 */
  #save-state.error { background: #fdeced; color: #b4232a; cursor: pointer; }
  #save-state.error::before { background: var(--danger); }
  #save-state.error:hover { background: #fbdcdf; }

  /* ---- 顶部错误横幅：后端连不上时明确告诉用户，别装作「没有笔记」 ---- */
  #banner {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; font-size: 13px;
    background: #fdeced; color: #b4232a;
    border-bottom: 1px solid #f5cfd1;
  }
  #banner .btn { margin-left: auto; }
  #banner svg { flex-shrink: 0; width: 16px; height: 16px; }

  .btn {
    padding: 6px 13px; font-size: 13px; font-family: inherit;
    cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-sub);
    transition: all .15s;
  }
  .btn:hover { background: #f4f5f7; color: var(--text); }
  button.danger:hover { background: #fdf2f2; border-color: #f3c9cb; color: var(--danger); }
  /* 待确认状态：变红实心，明确告诉用户「再点一次才真删」 */
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 500; }
  button.danger.armed:hover { background: #d33b40; border-color: #d33b40; color: #fff; }

  /* 未选中笔记时的引导 */
  #editor-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--text-mute);
  }
  #editor-empty svg { width: 44px; height: 44px; opacity: .4; }
  #editor-empty p { margin: 0; font-size: 13.5px; }

  /* 编辑区。正文限制最大宽度，行太长不好读。 */
  #edit-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  /* 通用显隐工具类。必须 !important：#edit-pane、.btn 这类选择器
     特异性比 .hidden 高，不加就盖不住它们的 display。 */
  .hidden { display: none !important; }
  .doc { width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 48px 120px; }

  #title {
    width: 100%; border: none; outline: none; background: transparent;
    padding: 0 0 12px; margin-bottom: 12px;
    font-size: 27px; font-weight: 700; line-height: 1.35;
    font-family: inherit; color: var(--text);
    border-bottom: 1px solid var(--border-soft);
  }
  #title::placeholder { color: #c4c9cf; }
  #body {
    flex: 1; width: 100%; min-height: 420px;
    border: none; outline: none; resize: none; background: transparent;
    font-size: 15.5px; line-height: 1.85; font-family: inherit; color: var(--text);
  }
  #body::placeholder { color: #c4c9cf; }
</style>
</head>
<body>
<div id="app">

  <!-- 顶部：品牌 + 全局搜索 -->
  <header>
    <div class="brand">
      <div class="brand-mark">记</div>
      <h1>个人工作台</h1>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索标题和正文…">
    </div>
  </header>

  <!-- 出错时才出现的横幅 -->
  <div id="banner" class="hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
         <path d="M12 8v5M12 16.5v.01"/></svg>
    <span id="banner-msg"></span>
    <button class="btn" id="banner-retry">重试</button>
  </div>

  <main>
    <!-- 左侧：笔记列表 -->
    <aside id="sidebar">
      <div id="note-list"></div>
      <div class="sidebar-foot">
        <button id="new-note">＋ 新建笔记</button>
      </div>
    </aside>

    <!-- 右侧：编辑器 -->
    <section id="editor">
      <div id="editor-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
          <path d="M14 3v6h6"/>
        </svg>
        <p>从左边选一条笔记，或点「新建笔记」开始写</p>
      </div>

      <div id="edit-pane" class="hidden">
        <div id="editor-head">
          <span id="save-state">已保存</span>
          <button class="btn hidden" id="cancel-delete">取消</button>
          <button class="btn danger" id="delete">删除</button>
        </div>
        <div class="doc">
          <input id="title" placeholder="标题">
          <textarea id="body" placeholder="开始写点什么…"></textarea>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
// ============ 全局状态 ============
let notes = [];        // 当前列表数据
let currentId = null;  // 正在编辑的笔记 id
let saveTimer = null;  // 自动保存的防抖计时器

// 常用元素
const $ = (id) => document.getElementById(id);
const listEl = $('note-list'), searchEl = $('search');
const titleEl = $('title'), bodyEl = $('body'), stateEl = $('save-state');

// ============ 小工具 ============
// 把 HTML 特殊字符转义，防止笔记内容里的 < > 破坏页面
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 把 "2026-10-13 15:04:05" 显示成好读的样子
function fmtTime(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d)) return s;
  const now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return hm;                       // 今天：只显示时间
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return d.getFullYear() === now.getFullYear() ? `${ymd}` : ymd;  // 今年内不显示年份
}

// 调用后端接口。失败时抛出带中文说明的错误，交给调用方处理。
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
  } catch (e) {
    // fetch 抛错 = 服务根本没连上（服务没启动、端口不通）
    throw new Error('连不上工作台服务');
  }
  if (!res.ok) throw new Error(`接口出错：${res.status}`);
  return res.status === 204 ? null : res.json();
}

// ============ 错误提示 ============
// 后端挂了要明确说出来。以前这里 catch 都不 catch，服务一停页面就默默显示
// 「没有笔记」，会让人以为笔记全没了。
function showBanner(msg) {
  $('banner-msg').textContent = msg;
  $('banner').classList.remove('hidden');
}
function hideBanner() {
  $('banner').classList.add('hidden');
}
$('banner-retry').addEventListener('click', () => loadList());

// 列表加载失败时的专用空状态：说清楚是「连不上」而不是「没内容」
function renderListError(msg) {
  listEl.innerHTML = `
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 9.5 12 3l7.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/>
        <path d="M12 9v4M12 16.5v.01"/>
      </svg>
      <p>${esc(msg)}</p>
    </div>`;
}

// ============ 列表 ============
async function loadList(keyword = searchEl.value.trim()) {
  const url = keyword ? `/api/notes?search=${encodeURIComponent(keyword)}` : '/api/notes';
  try {
    notes = await api(url);
  } catch (e) {
    // 加载失败：显示错误状态，不能当成「一条笔记都没有」
    renderListError('连不上工作台服务。请确认黑色命令行窗口还开着。');
    showBanner('连不上工作台服务。如果你没关掉命令行窗口，可能是它已经退出了。');
    return;
  }
  hideBanner();
  renderList();
}

// 列表为空时的占位图（搜索无结果和完全没笔记，文案不一样）
const EMPTY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;

function renderList() {
  if (notes.length === 0) {
    const hint = searchEl.value.trim() ? '没有找到相关笔记' : '还没有笔记，点下面新建一条';
    listEl.innerHTML = `<div class="empty">${EMPTY_ICON}<p>${hint}</p></div>`;
    return;
  }
  listEl.innerHTML = notes.map((n) => `
    <div class="item ${n.id === currentId ? 'active' : ''}" data-id="${n.id}">
      <div class="item-head">
        <span class="t">${esc(n.title)}</span>
        <span class="d">${fmtTime(n.updated_at)}</span>
      </div>
      <div class="snippet">${esc(n.body || '')}</div>
    </div>`).join('');
}

// ============ 保存状态提示 ============
// 三种状态：编辑中(不提示) / 保存中(黄) / 已保存(绿)
function setSaveState(state, text) {
  stateEl.classList.remove('saving', 'saved');
  if (state) stateEl.classList.add(state);
  stateEl.textContent = text;
}

// ============ 编辑 ============
function openNote(id) {
  const n = notes.find((x) => x.id === id);
  if (!n) return;
  disarmDelete();               // 换笔记时退出「待确认」，防止误删下一条
  currentId = id;
  titleEl.value = n.title;
  bodyEl.value = n.body || '';
  $('editor-empty').classList.add('hidden');
  $('edit-pane').classList.remove('hidden');
  setSaveState('saved', '已保存');
  renderList();                 // 高亮当前选中项
  titleEl.focus();
}

function closeEditor() {
  currentId = null;
  $('edit-pane').classList.add('hidden');
  $('editor-empty').classList.remove('hidden');
  renderList();
}

// 立即保存当前笔记
let saveFailed = false;   // 记录是否保存失败，关页面时要拦一道

async function saveNow() {
  if (currentId === null) return;
  setSaveState('saving', '保存中…');
  try {
    await api(`/api/notes/${currentId}`, {
      method: 'PUT',
      body: JSON.stringify({ title: titleEl.value, body: bodyEl.value }),
    });
  } catch (e) {
    // 保存失败：一定要显眼。不能默默失败——用户会以为存好了，其实内容会丢。
    saveFailed = true;
    setSaveState('error', '保存失败，点此重试');
    showBanner(`没能保存：${e.message}。你的内容还在输入框里，恢复服务后再点重试。`);
    return;
  }
  saveFailed = false;
  hideBanner();
  const t = new Date();
  setSaveState('saved', `已保存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`);
  await loadList();             // 刷新列表，让标题和更新时间同步
}

// 点红色的「保存失败」手动重试
stateEl.addEventListener('click', () => {
  if (saveFailed) { clearTimeout(saveTimer); saveNow(); }
});

// 输入后自动保存（防抖 800ms：停止打字 0.8 秒才存）
function scheduleSave() {
  setSaveState('', '编辑中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 800);
}

async function createNote() {
  let n;
  try {
    n = await api('/api/notes', {
      method: 'POST',
      body: JSON.stringify({ title: '无标题', body: '' }),
    });
  } catch (e) {
    showBanner(`新建失败：${e.message}`);
    return;
  }
  searchEl.value = '';          // 清掉搜索，保证新笔记在列表里可见
  await loadList('');
  openNote(n.id);
}

// ============ 删除（行内二次确认） ============
// 第一次点：按钮变红并显示「取消」；再点一次才真的删。
// 不用 confirm() 是因为它会阻塞整个页面，这里用行内确认更顺手，也不怕手滑。
const delBtn = $('delete'), cancelBtn = $('cancel-delete');
let confirmArmed = false;

function armDelete() {
  confirmArmed = true;
  delBtn.textContent = '确认删除？';
  delBtn.classList.add('armed');
  cancelBtn.classList.remove('hidden');
}

function disarmDelete() {
  confirmArmed = false;
  delBtn.textContent = '删除';
  delBtn.classList.remove('armed');
  cancelBtn.classList.add('hidden');
}

delBtn.addEventListener('click', async () => {
  if (currentId === null) return;

  if (!confirmArmed) { armDelete(); return; }   // 第一次点：只是进入待确认

  const id = currentId;
  disarmDelete();
  try {
    await api(`/api/notes/${id}`, { method: 'DELETE' });
  } catch (e) {
    showBanner(`删除失败：${e.message}`);
    return;                    // 失败了就不关编辑器，笔记还在，用户可以重试
  }
  closeEditor();
  await loadList();
});

cancelBtn.addEventListener('click', disarmDelete);

// ============ 事件绑定 ============
// 点左侧列表某条 → 右侧载入
listEl.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item) openNote(Number(item.dataset.id));
});

// 点「新建笔记」
$('new-note').addEventListener('click', createNote);

// 标题和正文变化 → 自动保存
titleEl.addEventListener('input', scheduleSave);
bodyEl.addEventListener('input', scheduleSave);

// 搜索框输入 → 实时过滤（防抖 300ms）
let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadList(), 300);
});

// 页面关闭前把没存完的内容补存一次；
// 如果上次保存失败过，就拦一下，别让用户稀里糊涂丢掉内容。
window.addEventListener('beforeunload', (e) => {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); }
  if (saveFailed) {
    e.preventDefault();
    e.returnValue = '';        // 浏览器会弹出「确认离开」提示
  }
});

// ============ 启动 ============
loadList();
</script>
</body>
</html>
