<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人工作台</title>
<style>
  /* ==========================================================
     个人工作台 · 样式
     设计原则：白底 + 一个主色，靠留白和层次说话，不堆装饰。
     ========================================================== */

  /* ---------- 设计变量：改这里就能整体换配色 ---------- */
  :root {
    --bg:          #f5f6f8;   /* 页面底色 */
    --surface:     #ffffff;   /* 卡片/面板底色 */
    --border:      #e8eaed;   /* 分隔线 */
    --border-soft: #f0f1f4;
    --text:        #1a1d21;   /* 主文字 */
    --text-sub:    #656b73;   /* 次要文字 */
    --text-mute:   #9aa1a9;   /* 更淡的说明文字 */
    --accent:      #4f6ef7;   /* 主色 */
    --accent-soft: #eef1ff;   /* 主色的浅底 */
    --danger:      #e5484d;
    --ok:          #30a46c;
    --warn:        #f5a524;
    --radius:      10px;
    --shadow:      0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* 细一点的滚动条，别抢视线 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #d6d9de; border-radius: 6px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #bcc1c8; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* 键盘操作时才显示聚焦圈，鼠标点击不显示 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ================= 顶部 ================= */
  header {
    display: flex; align-items: center; gap: 20px;
    height: 56px; padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #6d8bff, var(--accent));
    display: grid; place-items: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }

  /* 搜索框 */
  .search-wrap { position: relative; flex: 1; max-width: 460px; }
  .search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--text-mute); pointer-events: none;
  }
  #search {
    width: 100%; padding: 8px 12px 8px 34px;
    font-size: 13.5px; font-family: inherit; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #fafbfc; outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  #search::placeholder { color: var(--text-mute); }
  #search:focus {
    border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(79,110,247,.12);
  }
  #search::-webkit-search-cancel-button { cursor: pointer; }

  /* 顶部右侧的次要操作按钮 */
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* 导出和 AI 两个按钮共用一套外观。
     原来这条只写在 #export-btn 上，v3 加 AI 按钮时没吃到样式，
     结果按钮塌成一条竖着的窄片（文字被挤到换行）—— 一眼就看得出来是外挂上去的。
     共用 class 之后，以后再加第三个头部按钮也不会再犯同样的错。 */
  #export-btn, #ai-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    color: var(--text-sub); background: var(--surface); white-space: nowrap;
    border: 1px solid var(--border); border-radius: var(--radius);
    transition: all .15s;
  }
  #export-btn:hover, #ai-btn:hover { background: #f4f5f7; color: var(--text); }
  #export-btn svg, #ai-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ================= 主体两栏 ================= */
  main { flex: 1; display: flex; min-height: 0; }

  /* ---------- 左侧列表 ---------- */
  #sidebar {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  #note-list { flex: 1; overflow-y: auto; padding: 8px; }

  .item {
    position: relative;
    padding: 10px 12px; margin-bottom: 2px;
    border-radius: var(--radius); cursor: pointer;
    transition: background .12s;
  }
  .item:hover { background: #f6f7f9; }
  .item.active { background: var(--accent-soft); }
  /* 选中项左侧一道主色竖条 */
  .item.active::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }

  .item-head { display: flex; align-items: baseline; gap: 8px; }
  .item .t {
    flex: 1; min-width: 0; font-weight: 600; font-size: 14px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item.active .t { color: var(--accent); }
  .item .d { flex-shrink: 0; font-size: 11.5px; color: var(--text-mute); }
  /* 正文摘要，最多两行 */
  .item .snippet {
    margin-top: 3px; font-size: 12.5px; line-height: 1.5; color: var(--text-sub);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .item .snippet:empty { display: none; }

  /* 列表为空时的占位 */
  .empty {
    padding: 48px 20px; text-align: center; color: var(--text-mute);
  }
  .empty svg { width: 34px; height: 34px; margin-bottom: 10px; opacity: .45; }
  .empty p { margin: 0; font-size: 13px; }

  /* 新建按钮 */
  .sidebar-foot { padding: 10px 12px; border-top: 1px solid var(--border-soft); }
  #new-note {
    width: 100%; padding: 9px; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer; color: var(--text);
    border: 1px dashed #d3d7dd; border-radius: var(--radius);
    background: transparent;
    transition: all .15s;
  }
  #new-note:hover {
    border-style: solid; border-color: var(--accent);
    color: var(--accent); background: var(--accent-soft);
  }
  /* 快捷键提示：放在显眼的地方，不然没人知道有快捷键 */
  #hints {
    padding: 9px 4px 1px; font-size: 11px; line-height: 1.7;
    color: var(--text-mute); text-align: center;
  }
  #hints kbd {
    font-family: inherit; font-size: 10.5px; color: var(--text-sub);
    background: #f1f2f4; border: 1px solid #e4e6ea; border-radius: 4px;
    padding: 0 4px;
  }

  /* ---------- 右侧编辑器 ---------- */
  #editor { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }

  #editor-head {
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  /* 保存状态做成小药丸，用颜色告诉你状态 */
  #save-state {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto; padding: 4px 10px;
    font-size: 12px; color: var(--text-sub);
    background: #f4f5f7; border-radius: 999px;
    transition: background .2s, color .2s;
  }
  #save-state::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-mute); transition: background .2s;
  }
  #save-state.saving { background: #fff6e6; color: #a16207; }
  #save-state.saving::before { background: var(--warn); }
  #save-state.saved  { background: #eaf7f0; color: #1a7f4f; }
  #save-state.saved::before { background: var(--ok); }
  /* 保存失败：变红，并且点它可以手动重试 */
  #save-state.error { background: #fdeced; color: #b4232a; cursor: pointer; }
  #save-state.error::before { background: var(--danger); }
  #save-state.error:hover { background: #fbdcdf; }

  /* ---- 顶部错误横幅：后端连不上时明确告诉用户，别装作「没有笔记」 ---- */
  #banner {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px; font-size: 13px;
    background: #fdeced; color: #b4232a;
    border-bottom: 1px solid #f5cfd1;
  }
  #banner .btn { margin-left: auto; }
  #banner svg { flex-shrink: 0; width: 16px; height: 16px; }

  /* ---- 撤销提示条：删错了还有后悔药 ---- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 12px 10px 16px; font-size: 13px;
    color: #fff; background: #23262b; border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
    z-index: 50;
  }
  #toast.hidden { display: none !important; }
  #toast button {
    padding: 4px 10px; font-size: 13px; font-family: inherit; cursor: pointer;
    color: #fff; background: rgba(255,255,255,.16);
    border: 0; border-radius: 6px; font-weight: 500;
  }
  #toast button:hover { background: rgba(255,255,255,.28); }

  .btn {
    padding: 6px 13px; font-size: 13px; font-family: inherit;
    cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-sub);
    transition: all .15s;
  }
  .btn:hover { background: #f4f5f7; color: var(--text); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:disabled:hover { background: none; color: inherit; }
  button.danger:hover { background: #fdf2f2; border-color: #f3c9cb; color: var(--danger); }
  /* 待确认状态：变红实心，明确告诉用户「再点一次才真删」 */
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 500; }
  button.danger.armed:hover { background: #d33b40; border-color: #d33b40; color: #fff; }

  /* 未选中笔记时的引导 */
  #editor-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--text-mute);
  }
  #editor-empty svg { width: 44px; height: 44px; opacity: .4; }
  #editor-empty p { margin: 0; font-size: 13.5px; }

  /* 编辑区。正文限制最大宽度，行太长不好读。
     .doc 用 flex:1 吃掉剩余高度，正文框再 flex:1 填满 .doc，
     这样写笔记时正文区永远是满屏的，写得长时在框内自己滚动。 */
  #edit-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* 通用显隐工具类。必须 !important：#edit-pane、.btn 这类选择器
     特异性比 .hidden 高，不加就盖不住它们的 display。 */
  .hidden { display: none !important; }
  /* 滚动放在 .doc 上，让标题栏固定、正文框内部滚动 */
  .doc {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 32px 48px 60px;
    flex: 1; min-height: 0;
    overflow-y: auto;
  }

  #title {
    width: 100%; border: none; outline: none; background: transparent;
    padding: 0 0 12px; margin-bottom: 12px; flex-shrink: 0;
    font-size: 27px; font-weight: 700; line-height: 1.35;
    font-family: inherit; color: var(--text);
    border-bottom: 1px solid var(--border-soft);
  }
  #title::placeholder { color: #c4c9cf; }
  #body {
    flex: 1; width: 100%; min-height: 200px;   /* 200px 只是兜底，正常情况是 flex:1 撑满 */
    border: none; outline: none; resize: none; background: transparent;
    font-size: 15.5px; line-height: 1.85; font-family: inherit; color: var(--text);
  }
  #body::placeholder { color: #c4c9cf; }

  /* ---------- 编辑 / 分栏 / 预览 三种视图 ---------- */
  .mode-switch {
    display: inline-flex; padding: 2px; margin-right: 10px;
    background: #f1f2f4; border-radius: 8px;
  }
  .mode-switch button {
    padding: 4px 11px; font-size: 12.5px; font-family: inherit; cursor: pointer;
    color: var(--text-sub); background: transparent; border: 0; border-radius: 6px;
    transition: all .15s;
  }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.on { background: var(--surface); color: var(--accent); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  /* 布局链要一环扣一环全是 flex 容器，否则 #body 的 flex:1 根本不生效，
     正文框会被压成两三条高的一窄条。逐层：
       #edit-pane (列) → .doc (列, 撑满) → .panes (行, 撑满) → .pane (列) → #body (撑满) */
  .doc { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .panes { display: flex; gap: 36px; flex: 1; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #edit-pane.mode-edit .pane-view { display: none; }
  #edit-pane.mode-preview .pane-edit { display: none; }
  #edit-pane.mode-preview .markdown { min-height: 100%; }
  /* 分栏要放得下两列，把正文区放宽 */
  #edit-pane.mode-split .doc { max-width: 1120px; }
  #edit-pane.mode-split .pane-view {
    border-left: 1px solid var(--border-soft); padding-left: 36px;
  }

  /* ---------- Markdown 输入工具栏 ---------- */
  .md-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
    position: sticky; top: 0; z-index: 5;
    margin: 0 0 10px; padding: 6px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
  }
  .md-toolbar button {
    min-width: 28px; height: 28px; padding: 0 7px;
    font-size: 13px; font-family: inherit; line-height: 1;
    color: var(--text-sub); background: transparent;
    border: 1px solid transparent; border-radius: 6px; cursor: pointer;
    transition: all .12s;
  }
  .md-toolbar button:hover { background: #f1f2f4; color: var(--text); }
  .md-toolbar button:active { background: var(--accent-soft); color: var(--accent); }
  .md-toolbar button b { font-weight: 700; }
  .md-toolbar button i { font-style: italic; font-family: Georgia, serif; }
  .md-toolbar .sep { width: 1px; height: 16px; margin: 0 4px; background: var(--border); }

  /* 纯预览模式下不显示工具栏（没地方可操作） */
  #edit-pane.mode-preview .md-toolbar { display: none; }

  /* ---------- Markdown 渲染出来的样式 ---------- */
  .markdown { font-size: 15.5px; line-height: 1.85; color: var(--text); word-wrap: break-word; }
  .markdown > *:first-child { margin-top: 0; }
  .markdown p { margin: 0 0 1em; }
  .markdown h1, .markdown h2, .markdown h3,
  .markdown h4, .markdown h5, .markdown h6 {
    margin: 1.6em 0 .6em; line-height: 1.35; font-weight: 700;
  }
  .markdown h1 { font-size: 1.7em; }
  .markdown h2 { font-size: 1.42em; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
  .markdown h3 { font-size: 1.2em; }
  .markdown h4, .markdown h5, .markdown h6 { font-size: 1em; color: var(--text-sub); }
  .markdown ul, .markdown ol { margin: 0 0 1em; padding-left: 1.5em; }
  .markdown li { margin: .25em 0; }
  .markdown blockquote {
    margin: 0 0 1em; padding: .4em 0 .4em 1em;
    border-left: 3px solid var(--accent); color: var(--text-sub);
  }
  .markdown code {
    padding: .15em .4em; font-size: .88em; font-family: ui-monospace, Consolas, "Courier New", monospace;
    background: #f1f2f4; border-radius: 4px; color: #b4232a;
  }
  .markdown pre {
    margin: 0 0 1em; padding: 14px 16px; overflow-x: auto;
    background: #f6f7f9; border: 1px solid var(--border); border-radius: 8px;
  }
  .markdown pre code { padding: 0; background: none; color: var(--text); font-size: 13px; line-height: 1.6; }
  .markdown a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(79,110,247,.35); }
  .markdown a:hover { border-bottom-color: var(--accent); }
  .markdown hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .markdown img { max-width: 100%; border-radius: 6px; }
  .markdown del { color: var(--text-mute); }
  .markdown .ph { color: var(--text-mute); font-size: 13.5px; }

  /* ==========================================================
     v2 · 任务
     ========================================================== */

  /* 顶部的「笔记 / 任务」切换 */
  .view-switch {
    display: inline-flex; padding: 2px;
    background: #f1f2f4; border-radius: 8px; flex-shrink: 0;
  }
  .view-switch button {
    padding: 5px 14px; font-size: 13px; font-family: inherit; cursor: pointer;
    color: var(--text-sub); background: transparent; border: 0; border-radius: 6px;
    transition: all .15s;
  }
  .view-switch button:hover { color: var(--text); }
  .view-switch button.on {
    background: var(--surface); color: var(--accent);
    font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }

  /* ---------- 任务列表项 ---------- */
  .task-item { display: flex; align-items: flex-start; gap: 10px; }
  /* 圆圈勾选框：没完成是空心圆，完成了是绿底打勾 */
  .check {
    flex-shrink: 0; width: 17px; height: 17px; margin-top: 3px; padding: 0;
    border: 1.5px solid #c4c9cf; border-radius: 50%;
    background: transparent; cursor: pointer; transition: all .15s;
  }
  .check:hover { border-color: var(--accent); }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .check.on::after {
    content: ''; display: block; width: 4px; height: 8px; margin: 1px 0 0 5px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .task-main { flex: 1; min-width: 0; }
  /* 已完成：整行变淡 + 标题划掉 */
  .task-item.done .t { color: var(--text-mute); text-decoration: line-through; }
  .task-item.done { opacity: .75; }
  /* 截止日期标签。三档：普通 / 快到了（黄）/ 已逾期（红） */
  .due {
    display: inline-block; margin-top: 4px; padding: 1px 7px;
    font-size: 11.5px; line-height: 1.6; border-radius: 5px;
    color: var(--text-sub); background: #f1f2f4;
  }
  .due.soon { color: #a16207; background: #fff6e6; }
  .due.over { color: #b4232a; background: #fdeced; font-weight: 500; }
  /* 列表里的小节标题：待办 / 已完成 */
  .list-sec {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 12px 4px; font-size: 11.5px; color: var(--text-mute);
  }
  .list-sec b { font-weight: 600; color: var(--text-sub); }

  /* ---------- 任务编辑区 / 收藏编辑区 ----------
     同样要保证每一层都是 flex 容器（见坑 #9）：
       #task-pane(列) → #task-edit(列) → .doc.task-doc
       #bookmark-pane(列) → #bookmark-edit(列) → .doc.bm-doc
     少了中间那环，标题框就会被压扁。
     三个视图的骨架完全一样，所以选择器写在一起，别复制三遍。 */
  #task-pane, #bookmark-pane {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; min-height: 0; background: var(--surface);
  }
  #task-edit, #bookmark-edit { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #task-head, #bookmark-head {
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 20px; flex-shrink: 0;
    border-bottom: 1px solid var(--border-soft);
  }
  #task-empty, #bookmark-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--text-mute);
  }
  #task-empty svg, #bookmark-empty svg { width: 44px; height: 44px; opacity: .4; }
  #task-empty p, #bookmark-empty p { margin: 0; font-size: 13.5px; }
  .doc.task-doc { max-width: 720px; padding: 40px 48px 60px; }
  #task-title {
    width: 100%; border: none; outline: none; background: transparent;
    padding: 0 0 14px; flex-shrink: 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 24px; font-weight: 700; line-height: 1.4;
    font-family: inherit; color: var(--text);
  }
  #task-title::placeholder { color: #c4c9cf; }
  .task-fields { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .task-fields label { font-size: 13px; color: var(--text-sub); }
  #task-due {
    padding: 6px 10px; font-size: 13.5px; font-family: inherit; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; background: #fafbfc;
  }
  #task-due:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  /* 「标记完成」是任务页最高频的操作，给它做主色大按钮 */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 15px; font-size: 13.5px; font-family: inherit; cursor: pointer;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; font-weight: 500; transition: all .15s;
  }
  .btn-primary:hover { background: #3f5ae0; border-color: #3f5ae0; }
  .btn-primary.unmark { color: var(--text-sub); background: var(--surface); border-color: var(--border); }
  .btn-primary.unmark:hover { background: #f4f5f7; color: var(--text); }
  /* 刚勾完的任务闪一下绿，给个「生效了」的反馈 */
  .task-item.flash { animation: flashbg .9s ease-out; }
  @keyframes flashbg { from { background: #eaf7f0; } to { background: transparent; } }

  /* ---------- 统一搜索结果 ---------- */
  /* 搜索框里有字时，左侧列表整个换成这个面板（笔记和任务混在一起） */
  #search-results { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #search-summary {
    padding: 10px 12px; margin: 0 -8px 6px;
    font-size: 12px; color: var(--text-sub);
    background: var(--accent-soft); border-bottom: 1px solid #e0e6ff;
  }
  #search-summary b { color: var(--accent); font-weight: 600; }
  #search-summary .none { color: var(--text-mute); }
  /* 「笔记」「任务」两个小节标题，和任务列表里的 .list-sec 同一套样式 */
  .result-head {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 12px 4px; font-size: 11.5px; color: var(--text-mute);
  }
  .result-head b { font-weight: 600; color: var(--text-sub); }
  /* 结果上的类型标签，让人一眼看出这条是笔记还是任务 */
  .kind-tag {
    flex-shrink: 0; padding: 1px 6px; font-size: 10.5px; line-height: 1.7;
    border-radius: 4px; color: var(--accent); background: var(--accent-soft);
  }
  .kind-tag.task { color: #1a7f4f; background: #eaf7f0; }
  .kind-tag.bm { color: #a16207; background: #fff6e6; }
  /* 搜索词在摘要里高亮出来 */
  .result-item .snippet mark { background: #fff2b8; color: inherit; border-radius: 2px; }

  /* ---------- 收藏 ---------- */
  /* 列表项第二行是站点名，代替笔记的正文摘要 */
  .bm-host-line {
    margin-top: 3px; font-size: 12px; color: var(--text-mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc.bm-doc { max-width: 720px; padding: 40px 48px 60px; }
  /* 链接用等宽字体：一长串网址用比例字体看不清楚 / 也容易看错 */
  #bookmark-url {
    width: 100%; padding: 12px 14px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 10px; outline: none;
    background: #fafbfc; color: var(--text);
    font-size: 15px; font-family: ui-monospace, Consolas, "Courier New", monospace;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  #bookmark-url:focus {
    border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(79,110,247,.12);
  }
  /* 链接不合法时立刻标红，不用等保存失败才发现 */
  #bookmark-url.bad { border-color: var(--danger); background: #fdeced; }
  #bookmark-title {
    width: 100%; padding: 0 0 14px; margin-top: 22px; flex-shrink: 0;
    border: none; border-bottom: 1px solid var(--border-soft); outline: none;
    background: transparent;
    font-size: 21px; font-weight: 600; line-height: 1.4;
    font-family: inherit; color: var(--text);
  }
  #bookmark-title::placeholder { color: #c4c9cf; }
  .bm-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .bm-host { font-size: 13px; color: var(--text-mute); }
  .bm-hint { margin-top: 18px; font-size: 12.5px; line-height: 1.7; color: var(--text-mute); }
  .bm-hint.bad { color: var(--danger); }

  /* ---- 抓取状态和抓回来的内容 ---- */
  .bm-fetch-row { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
  /* 状态文字可能很长（失败原因是一整句话），所以让它自己占一行 / 自己换行，
     两个按钮打成一个组整体靠右 —— 否则按钮会被文字挤得竖排一列 */
  .bm-fetch-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line);
  }
  .bm-fetch-bar .fetch-state { flex: 1 1 auto; min-width: 0; }
  .bm-fetch-btns { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  .bm-sum-line { color: var(--text-mute); opacity: .85; }
  /* 抓失败的收藏在列表里的红色小标记（完整原因放在 title 里悬停看） */
  .bm-fetch-line {
    margin-top: 3px; font-size: 11.5px; color: var(--danger);
    display: inline-block; padding: 1px 6px; border-radius: 5px; background: #fdeeee;
  }
  .fetch-state { font-size: 12.5px; color: var(--text-mute); }
  .fetch-state.ok { color: var(--ok, #177245); }
  .fetch-state.fail { color: var(--danger); }
  .fetch-state.loading::after {
    content: ''; display: inline-block; width: 9px; height: 9px; margin-left: 7px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: bm-spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes bm-spin { to { transform: rotate(360deg); } }
  .bm-content { margin-top: 14px; }
  .bm-summary {
    font-size: 13.5px; line-height: 1.75; color: var(--text);
    background: var(--bg-soft, #f6f7f9); border-left: 3px solid var(--accent, #2f6feb);
    padding: 10px 12px; border-radius: 0 4px 4px 0;
  }
  .bm-summary:empty { display: none; }
  .bm-text {
    margin-top: 10px; max-height: 320px; overflow-y: auto;
    font-size: 13px; line-height: 1.85; color: var(--text-dim, #3c4148);
    white-space: pre-wrap; word-break: break-word;
    padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: #fff;
  }

  /* ==========================================================
     v3 · AI 设置弹窗
     ========================================================== */
  .ai-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(15,20,28,.38);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .ai-dialog {
    width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    padding: 22px 24px 20px;
  }
  .ai-dialog h2 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
  .ai-sub { margin: 0 0 18px; font-size: 12.5px; color: var(--text-mute); line-height: 1.7; }
  .ai-field { margin-bottom: 15px; }
  .ai-field label {
    display: block; font-size: 12.5px; font-weight: 500;
    margin-bottom: 5px; color: var(--text);
  }
  .ai-field select, .ai-field input {
    width: 100%; padding: 7px 10px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
  }
  .ai-field input:focus, .ai-field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,111,235,.12);
  }
  .ai-key-row { display: flex; gap: 8px; align-items: center; }
  .ai-key-row input { flex: 1; }
  /* 已存了 key 时的提示条 */
  .ai-key-state {
    margin-top: 7px; font-size: 12px; color: var(--text-mute); line-height: 1.65;
  }
  .ai-key-state b { color: var(--text-dim, #3c4148); font-weight: 500; }
  .ai-hint { margin: 6px 0 0; font-size: 11.5px; color: var(--text-mute); line-height: 1.65; }
  .ai-hint a { color: var(--accent); }
  /* 服务商/模型下方的说明（含厂商注意事项） */
  .ai-pv-note {
    margin: 7px 0 0; font-size: 11.5px; color: var(--text-mute); line-height: 1.7;
    padding: 8px 10px; background: var(--bg-soft, #f6f7f9); border-radius: 5px;
  }
  .ai-pv-note code {
    font-size: 11px; background: #fff; padding: 1px 4px;
    border: 1px solid var(--line); border-radius: 3px;
  }
  .ai-pending {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--text-mute); line-height: 1.7;
  }
  .ai-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line);
  }
  .ai-foot .ai-foot-msg { font-size: 12px; color: var(--text-mute); flex: 1; }
  .ai-foot .ai-foot-msg.ok { color: var(--ok, #177245); }
  .ai-foot .ai-foot-msg.err { color: var(--danger); }
  /* 顶栏那个 AI 按钮上的状态点。
     独立成一个 span 撑开自己的位置，而不是跟在文字后面 ——
     跟在文字后面会因为 inline-flex 的 gap 把它顶得很挤。 */
  .ai-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-mute); opacity: .45; margin-left: 2px;
  }
  .ai-dot.on { background: #177245; opacity: 1; }

  /* ---- 模型名 + 检测按钮 ----
     改成上下两行，不要并排。
     原来输入框和「检测可用模型」挤在同一行，弹窗最大宽 520px，
     按钮一占位输入框就只剩很窄一截，glm-5.3-flashx 这类长名字直接被截断。
     模型名是这一栏最需要看全的东西，宁可多占一行也不能截。 */
  .ai-model-row { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .ai-model-row .btn { align-self: flex-start; }
  .btn.loading::after {
    content: ''; display: inline-block; width: 9px; height: 9px;
    margin-left: 6px; vertical-align: -1px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: bm-spin .7s linear infinite;
  }
  /* 检测结果：可点选的小标签列表 */
  .ai-detect { margin-top: 9px; }
  .ai-detect-head {
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--text-mute); margin-bottom: 6px;
  }
  .ai-detect-toggle {
    font-size: 11.5px; font-family: inherit; cursor: pointer;
    color: var(--accent); background: transparent; border: 0; padding: 0;
  }
  .ai-detect-toggle:hover { text-decoration: underline; }
  .ai-detect-list {
    display: flex; flex-wrap: wrap; gap: 5px;
    max-height: 132px; overflow-y: auto;
    padding: 8px; background: var(--bg-soft, #f6f7f9); border-radius: 5px;
  }
  .ai-chip {
    font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace;
    padding: 3px 8px; border-radius: 4px; cursor: pointer;
    background: #fff; border: 1px solid var(--line); color: var(--text-dim, #3c4148);
  }
  .ai-chip:hover { border-color: var(--accent); color: var(--accent); }
  /* 已经填进去的那个，标出来免得在几十个里找不到 */
  .ai-chip.current { border-color: var(--accent); background: var(--accent); color: #fff; }
  .ai-detect-err { font-size: 12px; color: var(--danger); line-height: 1.65; }

</style>
</head>
<body>
<div id="app">

  <!-- 顶部：品牌 + 全局搜索 -->
  <header>
    <div class="brand">
      <div class="brand-mark">记</div>
      <h1>个人工作台</h1>
    </div>
    <!-- v2：笔记 / 任务 / 收藏 三个视图的切换 -->
    <div class="view-switch" id="view-switch">
      <button data-view="notes" class="on">笔记</button>
      <button data-view="tasks">任务</button>
      <button data-view="bookmarks">收藏</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索标题和正文…">
    </div>
    <div class="head-actions">
      <!-- v3：AI 设置入口。第 1 步只做到「配置存好」，还问不了。 -->
      <button id="ai-btn" title="设置 AI 服务商和模型">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/>
          <path d="M18 15l.9 2.1 2.1.9-2.1.9L18 21l-.9-2.1-2.1-.9 2.1-.9z"/>
        </svg>
        AI<span class="ai-dot" id="ai-dot"></span>
      </button>
      <!-- 导出备份：数据全在数据库文件里，这是唯一一份能在别处打开的副本 -->
      <button id="export-btn" title="把全部笔记导出成一个 Markdown 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>
        </svg>
        导出备份
      </button>
    </div>
  </header>

  <!-- 出错时才出现的横幅 -->
  <div id="banner" class="hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
         <path d="M12 8v5M12 16.5v.01"/></svg>
    <span id="banner-msg"></span>
    <button class="btn" id="banner-retry">重试</button>
  </div>

  <main>
    <!-- 左侧：笔记列表（笔记视图用） -->
    <aside id="sidebar">
      <div id="note-list"></div>
      <div id="task-list" class="hidden"></div>
      <div id="bookmark-list" class="hidden"></div>
      <div id="search-results" class="hidden"></div>
      <div class="sidebar-foot">
        <button id="new-note">＋ 新建笔记</button>
        <button id="new-task" class="hidden">＋ 新建任务</button>
        <button id="new-bookmark" class="hidden">＋ 收藏链接</button>
        <div id="hints"></div>
      </div>
    </aside>

    <!-- 右侧：编辑器 -->
    <section id="editor">
      <div id="editor-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
          <path d="M14 3v6h6"/>
        </svg>
        <p>从左边选一条笔记，或点「新建笔记」开始写</p>
      </div>

      <div id="edit-pane" class="hidden">
        <div id="editor-head">
          <div class="mode-switch">
            <button data-mode="edit">编辑</button>
            <button data-mode="split">分栏</button>
            <button data-mode="preview">预览</button>
          </div>
          <span id="save-state">已保存</span>
          <button class="btn hidden" id="cancel-delete">取消</button>
          <button class="btn danger" id="delete">删除</button>
        </div>
        <div class="doc">
          <input id="title" placeholder="标题">
          <div class="md-toolbar" id="md-toolbar"></div>
          <div class="panes">
            <div class="pane pane-edit">
              <textarea id="body" placeholder="开始写点什么…"></textarea>
            </div>
            <div class="pane pane-view">
              <div id="preview" class="markdown"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 右侧：任务编辑区（任务视图才显示，和笔记编辑器互斥） -->
    <section id="task-pane" class="hidden">
      <div id="task-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.5 9 17l10.5-10.5"/>
        </svg>
        <p>从左边选一条任务，或点「新建任务」记一件事</p>
      </div>

      <div id="task-edit" class="hidden">
        <div id="task-head">
          <span id="task-state">已保存</span>
          <button class="btn hidden" id="task-cancel">取消</button>
          <button class="btn danger" id="task-delete">删除</button>
        </div>
        <div class="doc task-doc">
          <input id="task-title" placeholder="要做什么？">
          <div class="task-fields">
            <label for="task-due">截止日期</label>
            <input id="task-due" type="date">
            <button class="btn-primary" id="task-toggle" style="margin-left:auto">标记完成</button>
          </div>
        </div>
      </div>
    </section>
    <!-- 右侧：收藏编辑区（收藏视图才显示） -->
    <section id="bookmark-pane" class="hidden">
      <div id="bookmark-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.2L5.5 20.5v-16a1 1 0 0 1 1-1z"/>
        </svg>
        <p>把以后还要看的链接存进来，或点「收藏链接」</p>
      </div>

      <div id="bookmark-edit" class="hidden">
        <div id="bookmark-head">
          <span id="bookmark-state">已保存</span>
          <button class="btn hidden" id="bookmark-cancel">取消</button>
          <button class="btn danger" id="bookmark-delete">删除</button>
        </div>
        <div class="doc bm-doc">
          <input id="bookmark-url" placeholder="https://把链接粘到这里">
          <input id="bookmark-title" placeholder="给它起个名字，以后好找">
          <div class="bm-row">
            <span class="bm-host" id="bookmark-host"></span>
            <a id="bookmark-open" class="btn" style="margin-left:auto"
               target="_blank" rel="noopener noreferrer">打开链接 ↗</a>
          </div>
          <p class="bm-hint" id="bookmark-hint">
            标题可以留空，会用网址自动生成一个。存好之后会自己去把网页的标题和正文抓回来。
          </p>

          <!-- 抓取状态 + 抓回来的内容 -->
          <div class="bm-fetch-bar">
            <span class="fetch-state" id="bookmark-fetch-state"></span>
            <span class="bm-fetch-btns">
              <button class="btn hidden" id="bookmark-toggle-content">查看正文</button>
              <button class="btn" id="bookmark-refetch">重新抓取</button>
            </span>
          </div>
          <div class="bm-content hidden" id="bookmark-content">
            <p class="bm-summary" id="bookmark-summary"></p>
            <div class="bm-text" id="bookmark-text"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 删除后的撤销条 -->
<div id="toast" class="hidden">
  <span id="toast-msg"></span>
  <button id="toast-undo">撤销</button>
</div>

<!-- v3：AI 设置弹窗。默认不渲染内容，打开时才填（避免每次开页面都去请求一次配置） -->
<div id="ai-backdrop" class="ai-backdrop hidden">
  <div class="ai-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-dialog-title">
    <h2 id="ai-dialog-title">AI 设置</h2>
    <p class="ai-sub">
      决定「问 AI」时把笔记发给哪一家。密钥只存在这台电脑的
      <code>data/ai-config.json</code> 里，不会进版本库，也不会写进导出的备份。
    </p>

    <div class="ai-field">
      <label for="ai-provider">服务商</label>
      <select id="ai-provider"></select>
      <p class="ai-pv-note" id="ai-pv-note"></p>
    </div>

    <div class="ai-field">
      <label for="ai-model">模型</label>
      <div class="ai-model-row">
        <!-- 模型名做成可自由输入：厂商改名比本程序更新快，
             拿一份会过期的白名单卡着，只会让新出的模型用不了。 -->
        <input id="ai-model" list="ai-model-options" placeholder="模型名">
        <button class="btn" id="ai-detect" type="button" title="问这家服务商要一份当前可用的模型列表">检测模型</button>
      </div>
      <datalist id="ai-model-options"></datalist>
      <p class="ai-hint" id="ai-model-hint"></p>
      <!-- 检测结果：一个可点选的小列表。点一下就填进上面那个框。 -->
      <div class="ai-detect hidden" id="ai-detect-box">
        <div class="ai-detect-head">
          <span id="ai-detect-summary"></span>
          <button class="ai-detect-toggle hidden" id="ai-show-all" type="button">显示全部</button>
        </div>
        <div class="ai-detect-list" id="ai-detect-list"></div>

    </div>

    <div class="ai-field">
      <label for="ai-key">API 密钥</label>
      <div class="ai-key-row">
        <input id="ai-key" type="password" autocomplete="off" placeholder="粘贴密钥" spellcheck="false">
        <button class="btn" id="ai-key-toggle" type="button" title="显示 / 隐藏">显示</button>
      </div>
      <p class="ai-key-state" id="ai-key-state"></p>

    <div id="ai-pending-box"></div>

    <div class="ai-foot">
      <span class="ai-foot-msg" id="ai-foot-msg"></span>
      <button class="btn danger" id="ai-reset">全部清除</button>
      <button class="btn" id="ai-cancel">取消</button>
      <button class="btn-primary" id="ai-save">保存</button>
    </div>
  </div>
</div>

<script>
// ============ 全局状态 ============
let notes = [];        // 当前列表数据
let currentId = null;  // 正在编辑的笔记 id
let saveTimer = null;  // 自动保存的防抖计时器

// 常用元素
const $ = (id) => document.getElementById(id);
const listEl = $('note-list'), searchEl = $('search');
const titleEl = $('title'), bodyEl = $('body'), stateEl = $('save-state');

// ============ 小工具 ============
// 把 HTML 特殊字符转义，防止笔记内容里的 < > 破坏页面
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 「列表上显示的标题」。标题可以合法地是空字符串（你新建了但还没打字），
// 直接渲染就是个空行，只剩右边一个时间戳 —— 夹在别的条目中间完全看不出是什么。
// 所以凡是要显示标题的地方都过这个函数，空的给个占位。
// 收藏多一层：空标题先试着用链接推一个（见 titleFromUrl），推不出才用占位。
function listTitle(raw, url) {
  const t = String(raw ?? '').trim();
  if (t) return t;
  if (url) {
    const guess = titleFromUrl(url);
    if (guess) return guess;
  }
  return '（无标题）';
}

// 把 Markdown 源码洗成一段能直接给人看的纯文字，用来当列表上的摘要。
//
// 为什么不能直接截正文：笔记正文是 Markdown 源码，列表上一条笔记底下直接甩出
// `## 核心观点 **减少表面工作**`、`| 优点 | 缺点 |`、`\`node:sqlite\`` 这种东西，
// 满屏符号，谁也没法扫读 —— 那不是「预览」，是把源码摊开了。
//
// 原则是**只去标记、留文字**，不跳过标题行：
// 「核心观点」这几个字本身就是内容，跳掉反而丢信息。
// 注意清洗完的纯文本最后还是要过 esc()（mark() 内部已经做了），这里不碰 HTML。
//
// 一个有意的取舍：搜索是**搜原文**、摘要显示的是**洗过的文字**，两者不完全一致。
// 所以搜索词正好落在代码块里时，笔记会被搜到，但摘要上看不到这个词在哪。
// 这是可接受的 —— 全文搜索本来就该能搜到代码，而摘要只是预览，点进去就看见了。
// 反过来（为了显示搜索词而把代码塞回摘要）会让每条笔记底下都拖着一段代码，更糟。
function plainText(md, maxLen = 120) {
  let s = String(md ?? '');
  // 围栏代码块整段拿掉（含没写完的半截）。代码塞进摘要里只会是一堆噪音，
  // 而且很容易正好把真正的那段话挤到第 200 个字以外，看都看不到。
  s = s.replace(/```[\s\S]*?(?:```|$)/g, '\n');

  const out = [];
  for (const raw of s.split('\n')) {
    let t = raw.trim();
    if (!t) continue;
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) continue;          // 分隔线
    t = t.replace(/^#{1,6}\s*/, '');                          // 标题井号
    t = t.replace(/^>\s?/, '');                               // 引用符号
    t = t.replace(/^([-*+]|\d+[.)])\s+/, '');                 // 列表符号
    // 表格行：把竖线和分隔用的 --- 那一行去掉，只留单元格文字
    if (/^\|.*\|$/.test(t)) {
      t = t.split('|').map((c) => c.trim()).filter((c) => c && !/^:?-{2,}:?$/.test(c)).join(' ');
      if (!t) continue;
    }
    // 行内标记。顺序有讲究：图片和链接要先剥（它们的 alt/文字里可能带星号），
    // 粗体和斜体最后剥，否则 `[**重点**](url)` 会剩下半截符号。
    t = t.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
         .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
         .replace(/`([^`]*)`/g, '$1')
         .replace(/\*\*([^*]+)\*\*/g, '$1')
         .replace(/__([^_]+)__/g, '$1')
         .replace(/~~([^~]+)~~/g, '$1')
         .replace(/(^|[^*])\*([^*]+)\*/g, '$1$2')
         .replace(/(^|[^_])_([^_]+)_/g, '$1$2');
    if (t) out.push(t);
  }
  const text = out.join(' ').replace(/\s+/g, ' ').trim();
  return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
}

// 把 "2026-10-13 15:04:05" 显示成好读的样子
function fmtTime(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d)) return s;
  const now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return hm;                       // 今天：只显示时间
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return d.getFullYear() === now.getFullYear() ? `${ymd}` : ymd;  // 今年内不显示年份
}

// 「多久之前」—— 任务列表右上角那个时间用它。
//
// 换掉 fmtTime 的原因：那个位置显示的是**最后修改时间**，但格式是
// 「21:19」/「昨天 10:00」/「2026-10-11」这种绝对时间，跟下面那个
// 「10月25日截止」的标签摆在一起，用户会分不清上面那个是创建还是截止。
// 改成相对时间就不用猜了 —— 「3 小时前」自己就说明这是新鲜度。
//
// 超过 30 天换回日期：那时候「43 天前」没有意义，你也想不起来是哪天。
// 精确时间不丢，放在 title 里，鼠标悬停能看到。
function fmtAgo(s) {
  if (!s) return '';
  const d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return s;
  const min = Math.floor((Date.now() - d.getTime()) / 60000);
  if (min < 1) return '刚刚';                    // 含「时间在未来的」这种时钟偏差
  if (min < 60) return `${min} 分钟前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} 小时前`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day} 天前`;
  const p = (v) => String(v).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// 精确时间，给 title 用的（悬停看到完整年月日时分）。
function fmtExact(s) {
  if (!s) return '';
  const d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return String(s);
  const p = (v) => String(v).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} 最后修改`;
}

// 调用后端接口。失败时抛出带中文说明的错误，交给调用方处理。
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
  } catch (e) {
    // fetch 抛错 = 服务根本没连上（服务没启动、端口不通）
    throw new Error('连不上工作台服务');
  }
  if (!res.ok) throw new Error(`接口出错：${res.status}`);
  return res.status === 204 ? null : res.json();
}

// ============ 错误提示 ============
// 后端挂了要明确说出来。以前这里 catch 都不 catch，服务一停页面就默默显示
// 「没有笔记」，会让人以为笔记全没了。
function showBanner(msg) {
  $('banner-msg').textContent = msg;
  $('banner').classList.remove('hidden');
}
function hideBanner() {
  $('banner').classList.add('hidden');
}
$('banner-retry').addEventListener('click', () => runSearch(searchEl.value));

// 列表加载失败时的专用空状态：说清楚是「连不上」而不是「没内容」
function renderListError(msg) {
  listEl.innerHTML = `
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 9.5 12 3l7.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/>
        <path d="M12 9v4M12 16.5v.01"/>
      </svg>
      <p>${esc(msg)}</p>
    </div>`;
}

// ============ 列表 ============
async function loadList(keyword = searchEl.value.trim()) {
  const url = keyword ? `/api/notes?search=${encodeURIComponent(keyword)}` : '/api/notes';
  try {
    notes = await api(url);
  } catch (e) {
    // 加载失败：显示错误状态，不能当成「一条笔记都没有」
    renderListError('连不上工作台服务。请确认黑色命令行窗口还开着。');
    showBanner('连不上工作台服务。如果你没关掉命令行窗口，可能是它已经退出了。');
    return;
  }
  hideBanner();
  syncListVisibility();
  renderList();
}

// 列表为空时的占位图（搜索无结果和完全没笔记，文案不一样）
const EMPTY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;

function renderList() {
  if (notes.length === 0) {
    const hint = searchEl.value.trim() ? '没有找到相关笔记' : '还没有笔记，点下面新建一条';
    listEl.innerHTML = `<div class="empty">${EMPTY_ICON}<p>${hint}</p></div>`;
    return;
  }
  listEl.innerHTML = notes.map((n) => `
    <div class="item ${n.id === currentId ? 'active' : ''}" data-id="${n.id}">
      <div class="item-head">
        <span class="t">${esc(listTitle(n.title))}</span>
        <span class="d">${fmtTime(n.updated_at)}</span>
      </div>
      <div class="snippet">${esc(plainText(n.body, 120))}</div>
    </div>`).join('');
}

// ============ Markdown 渲染（零依赖，自己写一个够用的） ============
// 不用现成库是这个项目的硬约束（不装任何 npm 包），所以只能手写。
//
// 安全是第一位的：**先整体转义，再做 Markdown 替换**。
// 这样笔记里写的 <script>、<img onerror=...> 会原样显示成文字，永远不会执行。
//
// 支持：# 标题、**粗体**、*斜体*、~~删除线~~、`行内代码`、``` 围栏代码块、
//       - 无序列表、1. 有序列表、> 引用、--- 分隔线、[文字](链接)、![图](地址)

const SAFE_SCHEME = /^(https?:|mailto:)/i;   // 只放行安全协议，防 javascript: 注入

// 行内标记。传进来的是**原文**，转义在这一步最前面做。
// 注意：不能先把整篇转义再切块 —— esc() 会把 > 变成 &gt;，
// 后面再用 /^>/ 判断引用就永远匹配不上，引用会退化成普通段落。
function mdInline(text) {
  let t = esc(text);

  // 行内代码先摘出来存好，否则里面的 * _ [ ] 会被后面的规则误伤。
  // 占位符用 \u0001 包住：转义后的正文不可能出现这个控制符，所以不会撞车。
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return `\u0001${codes.length - 1}\u0001`;
  });

  // 图片必须排在链接前面：
  // ![alt](url) 里也含有 [alt](url)，链接规则先跑会把它吃掉，感叹号剩在外面。
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => {
    if (!SAFE_SCHEME.test(src)) return m;
    return `<img src="${src}" alt="${alt}">`;
  });

  // 链接：协议不合法就原样显示（比如 javascript: 警告，点不得）
  t = t.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, label, href) => {
    if (!SAFE_SCHEME.test(href)) return m;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  t = t.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (m, a, b) => `<strong>${a || b}</strong>`);
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\*([^*\n]+)\*|_([^_\n]+)_/g, (m, a, b) => `<em>${a || b}</em>`);

  // 把行内代码放回去（必须最后一步，否则代码里的符号会被上面的规则改掉）
  return t.replace(/\u0001(\d+)\u0001/g, (m, i) => `<code>${codes[Number(i)]}</code>`);
}

function renderMarkdown(src) {
  if (!src || !src.trim()) {
    return '<p class="ph">左边写点内容，这里会实时显示渲染后的样子。</p>';
  }
  // 按**原文**切块，块级语法（> # ``` 等）在转义之前判断
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];

  const RE = {
    fence:    /^```/,
    heading:  /^(#{1,6})\s+(.*)$/,
    hr:       /^\s*(-{3,}|\*{3,}|_{3,})\s*$/,
    quote:    /^\s*>\s?/,
    ul:       /^\s*[-*+]\s+/,
    ol:       /^\s*\d+\.\s+/,
  };
  const isBlock = (l) =>
    RE.fence.test(l) || RE.heading.test(l) || RE.hr.test(l) ||
    RE.quote.test(l) || RE.ul.test(l) || RE.ol.test(l);

  const nl2br = (s) => s.replace(/\n/g, '<br>');

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 围栏代码块：整块原样输出，不做任何行内替换（内容单独转义）
    if (RE.fence.test(line)) {
      i++;
      const buf = [];
      while (i < lines.length && !RE.fence.test(lines[i])) buf.push(lines[i++]);
      i++;                                    // 跳过收尾围栏
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }

    // 标题
    let m = line.match(RE.heading);
    if (m) {
      const lv = m[1].length;
      out.push(`<h${lv}>${mdInline(m[2])}</h${lv}>`);
      i++;
      continue;
    }

    if (RE.hr.test(line)) { out.push('<hr>'); i++; continue; }

    // 引用：连续 > 合成一块
    if (RE.quote.test(line)) {
      const buf = [];
      while (i < lines.length && RE.quote.test(lines[i])) buf.push(lines[i++].replace(RE.quote, ''));
      out.push(`<blockquote>${nl2br(mdInline(buf.join('\n')))}</blockquote>`);
      continue;
    }

    // 无序列表
    if (RE.ul.test(line)) {
      const buf = [];
      while (i < lines.length && RE.ul.test(lines[i])) buf.push(lines[i++].replace(RE.ul, ''));
      out.push(`<ul>${buf.map((x) => `<li>${mdInline(x)}</li>`).join('')}</ul>`);
      continue;
    }

    // 有序列表
    if (RE.ol.test(line)) {
      const buf = [];
      while (i < lines.length && RE.ol.test(lines[i])) buf.push(lines[i++].replace(RE.ol, ''));
      out.push(`<ol>${buf.map((x) => `<li>${mdInline(x)}</li>`).join('')}</ol>`);
      continue;
    }

    // 空行
    if (!line.trim()) { i++; continue; }

    // 段落：连续的非块级行合成一段
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${nl2br(mdInline(buf.join('\n')))}</p>`);
  }
  return out.join('\n');
}
// ============ Markdown 输入工具栏 ============
// 目的：让人不用背语法，也不用手动敲符号。选中一段文字点「粗体」就变成 **这段**。
//
// 两个关键细节：
//  1) 点按钮时 textarea 会失焦，选区随之丢失。所以要在 mousedown 阶段 preventDefault，
//     让 textarea 保持焦点，光标和选区才不会跑掉。
//  2) 改完 value 后必须手动派发 input 事件，否则自动保存和实时预览都不会触发。

// 统一的改写入口：替换选区 → 摆好光标 → 通知其它功能
// caretEnd 省略时只摆光标；给了就把这一段选中，
// 这样「插入链接」之类的操作可以直接覆盖粘贴。
function replaceRange(s0, e0, text, caretStart, caretEnd) {
  const ta = bodyEl;
  const val = ta.value;
  ta.value = val.slice(0, s0) + text + val.slice(e0);
  ta.focus();
  const end = caretEnd == null ? caretStart : caretEnd;
  ta.setSelectionRange(caretStart, end);
  ta.dispatchEvent(new Event('input', { bubbles: true }));   // 触发自动保存 + 刷新预览
}

// 在光标处包一对符号。
// 选了字就包住选区并保持选中（符合编辑器惯例，回车或再点一次就能取消）
// 没选就插占位文字，并把占位词选中 —— 这样直接打字就能替换掉它
function wrap(before, after, placeholder) {
  const ta = bodyEl;
  const s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const sel = ta.value.slice(s0, e0);
  const inner = sel || placeholder;
  replaceRange(s0, e0, before + inner + after, s0 + before.length, s0 + before.length + inner.length);
}

// 对「光标所在的行」做操作（多选时逐行处理）
function eachLine(fn) {
  const ta = bodyEl;
  const val = ta.value;
  const s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const start = val.lastIndexOf('\n', s0 - 1) + 1;
  let end = val.indexOf('\n', e0);
  if (end === -1) end = val.length;
  const out = val.slice(start, end).split('\n').map(fn).join('\n');
  replaceRange(start, end, out, start + out.length);
}

// 标题：点了再点同一个级别就取消，反之换成目标级别
function toggleHeading(level) {
  eachLine((line) => {
    const bare = line.replace(/^\s*#{1,6}\s*/, '');
    const wasSame = new RegExp('^\\s*#{' + level + '}\\s').test(line);
    return wasSame ? bare : '#'.repeat(level) + ' ' + bare;
  });
}

// 列表/引用：已有同样的前缀就取消，否则加上
function toggleLinePrefix(prefix, re) {
  eachLine((line) => re.test(line) ? line.replace(re, '') : prefix + line);
}

// 工具栏按钮配置。label 是按钮上显示的字，title 是鼠标悬停的说明。
const MD_BUTTONS = [
  { label: 'H1', title: '一级标题', run: () => toggleHeading(1) },
  { label: 'H2', title: '二级标题', run: () => toggleHeading(2) },
  { label: 'H3', title: '三级标题', run: () => toggleHeading(3) },
  { sep: true },
  { label: '<b>B</b>', title: '粗体　Ctrl+B', run: () => wrap('**', '**', '粗体') },
  { label: '<i>I</i>', title: '斜体　Ctrl+I', run: () => wrap('*', '*', '斜体') },
  { label: '<s>S</s>', title: '删除线', run: () => wrap('~~', '~~', '删除的文字') },
  { label: '&lt;/&gt;', title: '行内代码', run: () => wrap('`', '`', '代码') },
  { sep: true },
  { label: '• 列表', title: '无序列表', run: () => toggleLinePrefix('- ', /^\s*-\s+/) },
  { label: '1. 列表', title: '有序列表', run: () => eachLine((line, i) =>
      /^\s*\d+\.\s+/.test(line) ? line.replace(/^\s*\d+\.\s+/, '') : `${i + 1}. ${line}`) },
  { label: '❝ 引用', title: '引用块', run: () => toggleLinePrefix('> ', /^\s*>\s?/) },
  { sep: true },
  { label: '⌘ 代码块', title: '整段代码块', run: () => wrap('\n```\n', '\n```\n', '在这里写代码') },
  { label: '🔗 链接', title: '插入链接（选中文字作为链接文字）', run: insertLink },
  { label: '— 分隔线', title: '插入分隔线', run: () => {
      const ta = bodyEl;
      const at = ta.selectionStart;
      const before = at > 0 && ta.value[at - 1] !== '\n' ? '\n' : '';
      const after = at < ta.value.length && ta.value[at] !== '\n' ? '\n' : '';
      replaceRange(at, at, `${before}\n---\n${after}`, at + before.length + 5);
  } },
];

// 链接：选中文字就拿它当链接文字，然后把网址那段选中，等着粘贴
function insertLink() {
  const ta = bodyEl;
  const s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const label = ta.value.slice(s0, e0) || '链接文字';
  const url = 'https://';
  const urlStart = s0 + label.length + 3;      // "[" + label + "](" 的长度
  replaceRange(s0, e0, `[${label}](${url})`, urlStart, urlStart + url.length);
}

let saveFailed = false;   // 记录是否保存失败，关页面时要拦一道

async function saveNow() {

  setSaveState('saving', '保存中…');
  try {
    await api(`/api/notes/${currentId}`, {
      method: 'PUT',
      body: JSON.stringify({ title: titleEl.value, body: bodyEl.value }),
    });
  } catch (e) {

    saveFailed = true;

const delBtn = $('delete'), cancelBtn = $('cancel-delete');

function armDelete() {

// ============ 撤销删除 ============
// 后端只是给笔记打了个删除时间戳，没有真删，所以这里能原样捞回来。
// 笔记和任务共用这一条撤销条，所以记下删的是哪一种。
let lastDeleted = null;      // { id, kind: 'note'|'task', title }
let toastTimer = null;

// 显示撤销条。8 秒后自动消失，但笔记在数据库里仍然是「已删除」状态，
// 随时可以用 POST /api/notes/:id/restore 捞回来。
function showUndo(info) {
  lastDeleted = info;
  $('toast-msg').textContent = `已删除「${info.title}」`;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 8000);
}

function hideToast() {
  $('toast').classList.add('hidden');

}

// 点「撤销」把刚才删掉的笔记 / 任务 / 收藏恢复
$('toast-undo').addEventListener('click', async () => {
  if (lastDeleted === null) return;
  const info = lastDeleted;      // hideToast() 会把 lastDeleted 清空，所以先存一份
  const k = KIND[info.kind];
  if (!k) return;
  try {
    await api(`/api/${info.kind === 'note' ? 'notes' : info.kind === 'task' ? 'tasks' : 'bookmarks'}/${info.id}/restore`,
              { method: 'POST' });
  } catch (e) {
    showBanner(`恢复失败：${e.message}`);
    return;
  }
  hideToast();
  // 被删的是哪一类、但当前停在别的视图，就切回去，
  // 否则用户点了「撤销」却看不到任何变化，会以为撤销失败了。
  if (k.view !== view) await setView(k.view);
  k.reload();
});

// 刻意写成同一套结构，以后再加东西照着抄就行。

// 把 'YYYY-MM-DD' 说成人话：已逾期 2 天 / 今天截止 / 3 天后截止 / 10月20日截止
// 返回 null 表示没设截止日期。
function dueLabel(due) {
  if (!due) return null;
  const d = new Date(due + 'T00:00:00');      // 补 T00:00:00 才能按本地时间解析
  if (isNaN(d)) return null;
  // 用「零点」比较，否则今天早上 8 点和今天下午 3 点会被算成差 1 天
  const today = new Date(); today.setHours(0, 0, 0, 0);
  d.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 86400000);
  if (days < 0)   return { text: `已逾期 ${-days} 天`, cls: 'over' };
  if (days === 0) return { text: '今天截止', cls: 'soon' };
  if (days === 1) return { text: '明天截止', cls: 'soon' };
  if (days <= 7)  return { text: `${days} 天后截止`, cls: '' };
  return { text: `${Number(due.slice(5, 7))}月${Number(due.slice(8, 10))}日截止`, cls: '' };
}

async function loadTasks(keyword = searchEl.value.trim()) {
  const url = keyword ? `/api/tasks?search=${encodeURIComponent(keyword)}` : '/api/tasks';
  try {
    tasks = await api(url);
  } catch (e) {
    taskListEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 9.5 12 3l7.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/>
          <path d="M12 9v4M12 16.5v.01"/>
        </svg>
        <p>连不上工作台服务。请确认黑色命令行窗口还开着。</p>
      </div>`;
    showBanner('连不上工作台服务。如果你没关掉命令行窗口，可能是它已经退出了。');
    return;
  }
  hideBanner();
  syncListVisibility();
  renderTasks();
}

function taskItemHtml(t) {
  const isDone = t.status === 'done';
  const due = dueLabel(t.due_date);
  // 已完成的任务不再显示截止标签：已经做完的事，逾期红字没有意义
  const dueHtml = (isDone || !due) ? '' : `<span class="due ${due.cls}">${esc(due.text)}</span>`;
  return `
    <div class="item task-item ${isDone ? 'done' : ''} ${t.id === currentTaskId ? 'active' : ''}" data-id="${t.id}">
      <button class="check ${isDone ? 'on' : ''}" data-toggle="${t.id}"
              title="${isDone ? '恢复为待办' : '标记完成'}"></button>
      <div class="task-main">
        <div class="item-head">
          <span class="t">${esc(listTitle(t.title))}</span>
          <span class="d" data-ago="${esc(t.updated_at)}" title="${esc(fmtExact(t.updated_at))}">${esc(fmtAgo(t.updated_at))}</span>
        </div>
        ${dueHtml}
      </div>
    </div>`;
}

function renderTasks() {
  if (tasks.length === 0) {
    const hint = searchEl.value.trim() ? '没有找到相关任务' : '还没有任务，点下面新建一条';
    taskListEl.innerHTML = `<div class="empty">${EMPTY_ICON}<p>${hint}</p></div>`;
    return;
  }
  // 分成「待办 / 已完成」两小节。后端已经排好序：未完成在前、逾期的排最上面
  const todo = tasks.filter((t) => t.status !== 'done');
  const done = tasks.filter((t) => t.status === 'done');
  let html = '';
  if (todo.length) html += `<div class="list-sec"><b>待办</b>${todo.length}</div>` + todo.map(taskItemHtml).join('');
  if (done.length) html += `<div class="list-sec"><b>已完成</b>${done.length}</div>` + done.map(taskItemHtml).join('');
  taskListEl.innerHTML = html;
}

// 相对时间会随时间变旧：一条 3 小时前的任务，页面开着一小时之后再去看，
// 还写着「3 小时前」就是错的（它早就是 4 小时前了）。
// 每分钟把这些文字重算一遍 —— 只改 textContent，不重新请求接口，很便宜。
// 原始时间戳存在 data-ago 上，所以不用重新拉列表。
function refreshTaskAgo() {
  taskListEl.querySelectorAll('.d[data-ago]').forEach((el) => {
    el.textContent = fmtAgo(el.dataset.ago);
  });
}
setInterval(() => {
  // 只在真的看得见的时候刷。搜索模式下 .d 是绝对时间（搜索结果不显示时间），不用管。
  if (view === 'tasks' && !inSearchMode()) refreshTaskAgo();
}, 60000);

function setTaskSaveState(state, text) {

  if (state) taskStateEl.classList.add(state);
  taskStateEl.textContent = text;
}

function openTask(id) {

  taskDisarmDelete();
  currentTaskId = id;
  taskTitleEl.value = t.title;

let taskSaveFailed = false;

async function saveTaskNow() {

  const status = cur ? cur.status : 'todo';   // 完成状态在 toggleTask 里单独改

    return;
  }
  taskSaveFailed = false;
  hideBanner();
  const t = new Date();
  setTaskSaveState('saved', `已保存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`);

// 勾选框：完成 / 取消完成
// 先在本地改好再发请求，点完立刻有反馈，不用等网络来回。
async function toggleTask(id) {
  const t = tasks.find((x) => x.id === id);
  if (!t) return;
  const next = t.status === 'done' ? 'todo' : 'done';

  // 正在看这条任务的话，编辑区里的按钮文案要跟着换
  if (id === currentTaskId) {
    taskToggleBtn.textContent = next === 'done' ? '恢复为待办' : '标记完成';
    taskToggleBtn.classList.toggle('unmark', next === 'done');
  }
  t.status = next;
  renderTasks();
  // 闪一下绿，告诉用户「点生效了」
  const el = taskListEl.querySelector(`.item[data-id="${id}"]`);
  if (el && next === 'done') {
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 900);
  }

  try {
    await api(`/api/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ title: t.title, status: next, due_date: t.due_date || '' }),
    });
  } catch (e) {
    t.status = t.status === 'done' ? 'todo' : 'done';   // 失败就改回去
    renderTasks();
    showBanner(`更新失败：${e.message}`);
    return;
  }
  await loadTasks();
}
