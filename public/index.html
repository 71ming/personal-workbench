// 点编辑区里的「标记完成」大按钮，走的是同一个 toggleTask
taskToggleBtn.addEventListener('click', () => {
  if (currentTaskId !== null) toggleTask(currentTaskId);
});
taskStateEl.addEventListener('click', () => {
  if (taskSaveFailed) { clearTimeout(taskSaveTimer); saveTaskNow(); }
});

// 点左侧列表：勾选框单独处理，其它位置是打开这条任务
taskListEl.addEventListener('click', (e) => {
  const chk = e.target.closest('.check');
  if (chk) { e.stopPropagation(); toggleTask(Number(chk.dataset.toggle)); return; }
  const item = e.target.closest('.item');
  if (item) openTask(Number(item.dataset.id));
});

$('new-task').addEventListener('click', createTask);

// ============ v2.3：收藏 ============
// 只存链接和标题，**不联网**。抓正文和摘要是下一步的事。

let bookmarks = [];            // 当前收藏列表
let currentBookmarkId = null;  // 正在编辑的收藏 id；null = 还没存过的新收藏
let bookmarkSaveTimer = null;
let bookmarkSaveFailed = false;
let bookmarkConfirmArmed = false;
let autoTitle = '';            // 标题是自动生成的（''）还是用户自己打的

const bookmarkListEl = $('bookmark-list');
const bmUrlEl = $('bookmark-url'), bmTitleEl = $('bookmark-title');
const bmHostEl = $('bookmark-host'), bmOpenEl = $('bookmark-open');
const bmHintEl = $('bookmark-hint'), bmStateEl = $('bookmark-state');
const bmDelBtn = $('bookmark-delete'), bmCancelBtn = $('bookmark-cancel');
const bmFetchStateEl = $('bookmark-fetch-state'), bmRefetchBtn = $('bookmark-refetch');
const bmContentEl = $('bookmark-content'), bmSummaryEl = $('bookmark-summary'), bmTextEl = $('bookmark-text');
const bmToggleBtn = $('bookmark-toggle-content');
let bmFetchingId = null;     // 正在抓的是哪一条（按 id 记，不能用全局开关 ——
                             //  否则在 A 抓取期间切到 B，B 会被显示成「正在抓」）
let bmShowFullText = false;  // 正文是折叠还是展开

// 这个标题是「我们按网址自动拼的」还是「用户自己打的」。
// 只有自动的才允许被网页抓回来的真标题替换掉（后端也做同样的判断，两边都挡一道）。
function isAutoTitle(title, url) {
  const t = String(title || '').trim();
  if (!t) return true;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    if (t === host || t.endsWith(' · ' + host)) return true;
    const bare = (s) => String(s).replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    return bare(t) === bare(u.toString());
  } catch { return false; }
}

// 只放行 http/https。后端入库前已经验过一遍，这里再验一次是「保险」：
// 免得以后数据从别的口子进来（比如将来做导入），点一下就执行脚本。
const SAFE_HTTP = /^https?:\/\//i;
function safeLink(u) {
  const s = String(u || '').trim();
  return SAFE_HTTP.test(s) ? s : '';
}

// 从网址里推出一个能看的标题，纯字符串处理，不发任何请求：
//   https://developer.mozilla.org/zh-CN/docs/Web/HTML
//     -> "HTML · developer.mozilla.org"
// 这样不联网也有个像样的默认标题，不用每次对着空白输入框发呆。
function titleFromUrl(raw) {
  let u;
  try { u = new URL(String(raw).trim()); } catch { return ''; }
  const host = u.hostname.replace(/^www\./, '');
  // 路径末段解码成中文（维基百科那种 /wiki/%E7%91%9E... 解出来是「瑞克物理论」）。
  // 但 decodeURIComponent 碰到残缺的百分号序列会直接抛异常 —— 比如 https://example.com/100%off
  // 这种地址一粘贴进来就会让整个函数炸掉，所以这里必须单独兜住。
  let seg = '';
  try { seg = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || ''); }
  catch { seg = u.pathname.split('/').filter(Boolean).pop() || ''; }   // 解不了就用原文，不比空强
  const tail = seg.replace(/[-_]+/g, ' ').trim();
  if (host && tail) return `${tail} · ${host}`;
  return host || '';
}

async function loadBookmarks(keyword = searchEl.value.trim()) {
  const url = keyword ? `/api/bookmarks?search=${encodeURIComponent(keyword)}` : '/api/bookmarks';
  try {
    bookmarks = await api(url);
  } catch (e) {
    bookmarkListEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 9.5 12 3l7.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/>
          <path d="M12 9v4M12 16.5v.01"/>
        </svg>
        <p>连不上工作台服务。请确认黑色命令行窗口还开着。</p>
      </div>`;
    showBanner('连不上工作台服务。如果你没关掉命令行窗口，可能是它已经退出了。');
    return;
  }
  hideBanner();
  syncListVisibility();
  renderBookmarks();
  renderBookmarkContent();     // 列表刷新了，正在看的那条的状态/内容也要跟着更新
}

function renderBookmarks() {
  if (bookmarks.length === 0) {
    const hint = searchEl.value.trim() ? '没有找到相关收藏' : '还没有收藏，点下面存一个链接';
    bookmarkListEl.innerHTML = `<div class="empty">${EMPTY_ICON}<p>${hint}</p></div>`;
    return;
  }
  bookmarkListEl.innerHTML = bookmarks.map((b) => {
    const sum = bmSummary(b, '');
    return `
    <div class="item bm-item ${b.id === currentBookmarkId ? 'active' : ''}" data-id="${b.id}">
      <div class="item-head">
        <span class="t">${esc(listTitle(b.title, b.url))}</span>
        <span class="d">${fmtTime(b.updated_at)}</span>
      </div>
      <div class="bm-host-line">${esc(b.url)}</div>
      ${sum ? `<div class="bm-host-line bm-sum-line">${sum}</div>` : ''}
      ${bmFailLine(b)}
    </div>`;
  }).join('');
}

// 抓失败的收藏，在列表里给个红色小标记。
//
// 为什么要加：编辑区里明明写着「没抓到：xxx」，但列表上完全看不出来，
// 一条失败的和一条「刚存下还没来得及抓」长得一模一样 —— 扫一眼分不出哪些是真抓不到。
// 这里只在失败时显示，鼠标悬停能看到完整原因（列表窄，塞不下整句话）。
function bmFailLine(b) {
  if (!b.fetch_error) return '';
  return `<div class="bm-fetch-line" title="${esc(b.fetch_error)}">没抓到内容</div>`;
}

// 「这两段话是不是同一句」。
// 归一化：去掉所有空白、转小写、去掉末尾的句号问号之类。
//
// 为什么要判：不少网页的 og:description 就是 <title> 的原样重复
// （w3.org 的规范页就是个典型例子，标题和摘要都是「HTML Standard」）。
// 不挡掉的话列表上同一个词连着出现两遍 —— 白占一行，看着还像渲染出错了。
// 判成「一样」之后列表里就只剩标题那一句，清爽。
function sameText(a, b) {
  const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, '')
                            .replace(/[。.!！?？,，、;；:：~～…]+$/, '');
  const na = norm(a), nb = norm(b);
  return !!na && na === nb;
}

// 该显示的摘要：已去掉空值和「跟标题重复的」，也截断好了。
// 传 keyword 就走高亮（搜索结果面板用），不传就只转义（收藏列表用）。
// 列表和搜索面板原来是各写各的，截断长度还一个 70 一个 80，这里统一成 80。
function bmSummary(b, keyword, maxLen = 80) {
  const s = String(b.summary || '').trim();
  if (!s) return '';
  if (sameText(s, b.title)) return '';
  const cut = s.length > maxLen ? s.slice(0, maxLen) + '…' : s;
  return keyword ? mark(cut, keyword) : esc(cut);
}

// ---------- 抓取状态和内容的显示 ----------
function renderBookmarkContent() {
  const b = bookmarks.find((x) => x.id === currentBookmarkId);
  const cls = ['fetch-state'];
  let text = '';

  if (!b) {
    bmContentEl.classList.add('hidden');
    bmFetchStateEl.textContent = '';
    bmRefetchBtn.classList.add('hidden');
    bmToggleBtn.classList.add('hidden');
    return;
  }

  // 只有「正在抓的这一条」才算抓取中；切到别的收藏时该显示它自己的状态
  const mine = bmFetchingId === b.id;

  bmRefetchBtn.classList.remove('hidden');
  bmRefetchBtn.textContent = mine ? '抓取中…' : '重新抓取';
  bmRefetchBtn.disabled = mine;          // 抓的过程中别让人反复点

  if (mine) {
    cls.push('loading');
    text = '正在打开这个网页…';
  } else if (b.fetch_error) {
    cls.push('fail');
    text = `没抓到：${b.fetch_error}`;
  } else if (b.fetched_at) {
    cls.push('ok');
    text = `已抓取（${b.fetched_at.slice(5, 16)}）`;
  } else {
    text = '还没抓取';
  }
  bmFetchStateEl.className = cls.join(' ');
  bmFetchStateEl.textContent = text;

  const has = !!(b.summary || b.content);
  bmContentEl.classList.toggle('hidden', !has);
  // 摘要和标题是同一句话时也别显示两遍。给空字符串就行，
  // .bm-summary:empty 这条 CSS 已经会把它整个藏掉，不用再动 hidden。
  bmSummaryEl.textContent = sameText(b.summary, b.title) ? '' : (b.summary || '');
  bmTextEl.textContent = b.content || '';
  bmToggleBtn.classList.toggle('hidden', !has || !(b.content && b.content !== b.summary));
  bmToggleBtn.textContent = bmShowFullText ? '收起正文' : '查看正文';
  bmTextEl.style.display = bmShowFullText ? '' : 'none';
}

// 真的去抓一次。手动点「重新抓取」和保存后自动抓，都走这一个函数。
async function runFetch(id, manual) {
  if (bmFetchingId !== null) return;      // 已经有一条在抓了
  bmFetchingId = id;
  renderBookmarkContent();
  try {
    const b = await api(`/api/bookmarks/${id}/fetch`, { method: 'POST' });
    // 后端只在「原标题是自动生成的」时才换标题；这边再确认一次输入框里的
    // 标题没被用户手改过，才把新标题写回输入框（避免覆盖你正在打的字）。
    if (b.title && b.title !== bmTitleEl.value && autoTitle && bmTitleEl.value === autoTitle) {
      bmTitleEl.value = b.title;
      autoTitle = b.title;
      await api(`/api/bookmarks/${id}`, { method: 'PUT', body: JSON.stringify({ url: b.url, title: b.title }) });
    }
    // 抓失败不算错误：链接好好存着，只是没内容。红色提示一下就够了。
    if (b.fetch_error && manual) showBanner(`没抓到内容：${b.fetch_error}`);
  } catch (e) {
    showBanner(`抓取没成功：${e.message}`);
  } finally {
    bmFetchingId = null;
    await loadBookmarks();
    renderBookmarkContent();
  }
}

// 保存完顺手自动抓一次。条件是「从没抓过」：
// 抓失败的不自动重试（否则你每改一个字标题就重抓一次），
// 抓成功过的更不重抓。要重来就点「重新抓取」。
function maybeAutoFetch(b) {
  if (!b || currentBookmarkId === null) return;
  if (b.fetched_at || b.fetch_error) return;
  runFetch(b.id, false);
}

function setBookmarkSaveState(state, text) {
  bmStateEl.classList.remove('saving', 'saved');
  if (state) bmStateEl.classList.add(state);
  bmStateEl.textContent = text;
}

// 把链接框的状态（正常 / 标红）和「打开链接」按钮一起刷新
function syncBookmarkFields() {
  const raw = bmUrlEl.value.trim();
  const ok = !!safeLink(raw);
  bmUrlEl.classList.toggle('bad', !!raw && !ok);
  if (!raw) {
    bmHintEl.className = 'bm-hint';
    bmHintEl.textContent = '标题可以留空，会用网址自动生成一个。存好之后会自己去把网页的标题和正文抓回来。';
  } else if (!ok) {
    bmHintEl.className = 'bm-hint bad';
    bmHintEl.textContent = '这不像一个能打开的网址。必须以 http:// 或 https:// 开头。';
  } else {
    bmHintEl.className = 'bm-hint';
    let host = '';
    try { host = new URL(raw).hostname; } catch { /* 上面已经验过了，这里只是取个名字 */ }
    bmHintEl.textContent = host ? `来自 ${host}` : '';
  }
  // 链接不合法时不给可点的入口
  bmOpenEl.classList.toggle('hidden', !ok);
  if (ok) bmOpenEl.href = raw;
}

function openBookmark(id) {
  const b = bookmarks.find((x) => x.id === id);
  if (!b) return;
  bookmarkDisarmDelete();
  currentBookmarkId = id;
  bmUrlEl.value = b.url;
  bmTitleEl.value = b.title;
  // 打开已存的收藏时判断一下：标题要还是「自动生成的那种」，
  // 后面抓到网页真标题才允许替换（用户自己起的名字一个字都不动）。
  autoTitle = isAutoTitle(b.title, b.url) ? b.title : '';
  bmShowFullText = false;
  $('bookmark-empty').classList.add('hidden');
  $('bookmark-edit').classList.remove('hidden');
  setBookmarkSaveState('saved', '已保存');
  syncBookmarkFields();
  renderBookmarks();
  renderBookmarkContent();
  bmTitleEl.focus();
}

// 打开一条「还没存过」的收藏（点新建按钮进来的）
function openNewBookmark() {
  bookmarkDisarmDelete();
  currentBookmarkId = null;
  bmUrlEl.value = '';
  bmTitleEl.value = '';
  autoTitle = '';
  bmShowFullText = false;
  $('bookmark-empty').classList.add('hidden');
  $('bookmark-edit').classList.remove('hidden');
  setBookmarkSaveState('', '还没存');
  syncBookmarkFields();
  renderBookmarkContent();      // 新收藏还没链接，抓取按钮先藏起来
  bmUrlEl.focus();
}

function closeBookmarkEditor() {
  currentBookmarkId = null;
  bmFetchingId = null;
  $('bookmark-edit').classList.add('hidden');
  $('bookmark-empty').classList.remove('hidden');
  renderBookmarks();
  renderBookmarkContent();
}

async function saveBookmarkNow() {
  const u = bmUrlEl.value.trim();
  if (!u) { showBanner('先填一个链接再保存。'); return; }
  if (!safeLink(u)) {
    syncBookmarkFields();
    showBanner('链接必须以 http:// 或 https:// 开头，这条收藏没有保存。');
    return;
  }
  setBookmarkSaveState('saving', '保存中…');
  const payload = JSON.stringify({ url: u, title: bmTitleEl.value });
  let saved = null;
  try {
    if (currentBookmarkId === null) {
      // 第一次保存 = 新建。和笔记/任务不一样：
      // 它们是「先建空壳再编辑」，但一条没有链接的收藏既存不进去、也不该存在，
      // 所以等用户填了链接、真要存了，才去建这条记录。
      saved = await api('/api/bookmarks', { method: 'POST', body: payload });
      currentBookmarkId = saved.id;
      // 注意：这里**不要**把 autoTitle 清空。
      // 如果标题还是「按网址自动生成的那个」（用户没动过标题框），
      // 抓完网页之后要用网页的真标题把它换掉；
      // 用户要是自己改过标题，标题框的 input 事件早就把 autoTitle 清空了。
    } else {
      saved = await api(`/api/bookmarks/${currentBookmarkId}`, { method: 'PUT', body: payload });
    }
  } catch (e) {
    bookmarkSaveFailed = true;
    setBookmarkSaveState('error', '保存失败，点此重试');
    showBanner(`没能保存收藏：${e.message}。你填的内容还在输入框里，恢复服务后再点重试。`);
    return;
  }
  bookmarkSaveFailed = false;
  hideBanner();
  const t = new Date();
  setBookmarkSaveState('saved', `已保存 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`);
  await loadBookmarks();            // 刷新列表，标题和排序跟着更新
  renderBookmarkContent();
  // 链接存好了就去把网页内容抓回来。不 await —— 抓取要好几秒，
  // 不能让你对着界面干等，期间该干什么干什么。
  maybeAutoFetch(saved);
}

function scheduleBookmarkSave() {
  setBookmarkSaveState('', '编辑中…');
  clearTimeout(bookmarkSaveTimer);
  bookmarkSaveTimer = setTimeout(saveBookmarkNow, 800);
}

// 链接一改就同步校验 + 顺手生成标题
bmUrlEl.addEventListener('input', () => {
  syncBookmarkFields();
  // 只有在「标题还是空的」或「标题就是上次自动生成的那个」时才代填，
  // 绝不能覆盖用户自己打的字。
  if (bmTitleEl.value === '' || bmTitleEl.value === autoTitle) {
    const guess = titleFromUrl(bmUrlEl.value);
    if (guess) { bmTitleEl.value = guess; autoTitle = guess; }
  }
  scheduleBookmarkSave();
});

// 标题被手动改过之后，就不再自动覆盖
bmTitleEl.addEventListener('input', () => { autoTitle = ''; scheduleBookmarkSave(); });

// 点「打开链接」前先把 href 确认一遍
bmOpenEl.addEventListener('click', (e) => {
  if (!safeLink(bmUrlEl.value)) e.preventDefault();
});

// 删除：和笔记、任务一样是行内二次确认
function bookmarkArmDelete() {
  bookmarkConfirmArmed = true;
  bmDelBtn.textContent = '确认删除？';
  bmDelBtn.classList.add('armed');
  bmCancelBtn.classList.remove('hidden');
}

function bookmarkDisarmDelete() {
  bookmarkConfirmArmed = false;
  bmDelBtn.textContent = '删除';
  bmDelBtn.classList.remove('armed');
  bmCancelBtn.classList.add('hidden');
}

bmDelBtn.addEventListener('click', async () => {
  if (currentBookmarkId === null) {      // 还没存过的新收藏，直接关掉就行
    if (!bookmarkConfirmArmed) { bookmarkArmDelete(); return; }
    closeBookmarkEditor();
    return;
  }
  if (!bookmarkConfirmArmed) { bookmarkArmDelete(); return; }

  const id = currentBookmarkId;
  const b = bookmarks.find((x) => x.id === id);
  bookmarkDisarmDelete();
  try {
    await api(`/api/bookmarks/${id}`, { method: 'DELETE' });
  } catch (e) {
    showBanner(`删除失败：${e.message}`);
    return;
  }
  closeBookmarkEditor();
  await loadBookmarks();
  showUndo({ id, kind: 'bookmark', title: b ? b.title : '这条收藏' });
});

bmCancelBtn.addEventListener('click', bookmarkDisarmDelete);

// 「重新抓取」：抓失败、或内容过期了想重来时点它
bmRefetchBtn.addEventListener('click', () => {
  if (currentBookmarkId === null) {
    showBanner('先把链接保存下来，才能去抓网页内容。');
    return;
  }
  runFetch(currentBookmarkId, true);
});

// 「查看正文 / 收起正文」
bmToggleBtn.addEventListener('click', () => {
  bmShowFullText = !bmShowFullText;
  renderBookmarkContent();
});

bmStateEl.addEventListener('click', () => {
  if (bookmarkSaveFailed) { clearTimeout(bookmarkSaveTimer); saveBookmarkNow(); }
});

bookmarkListEl.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item) openBookmark(Number(item.dataset.id));
});

$('new-bookmark').addEventListener('click', openNewBookmark);

// ============ v2.2：统一搜索（笔记 + 任务一起搜） ============
// 以前搜索框只过滤当前视图的列表，想找的东西在另一个视图里就得先切过去再搜。
// 现在搜索框是全局的：框里有字，左侧就变成「笔记和任务的混合结果」。
//
// 「搜索模式」的唯一判据是搜索框里有没有字 —— 不要另外维护一个状态变量，
// 否则清空搜索框时很容易忘了同步。

function inSearchMode() {
  return !!searchEl.value.trim();
}

// 统一决定左侧该显示谁：搜索结果面板 / 笔记列表 / 任务列表。
// 所有会改变列表的路径都调它，这样就不会出现「切了视图但显示的还是旧面板」。
function syncListVisibility() {
  const searching = inSearchMode();
  searchResultsEl.classList.toggle('hidden', !searching);
  $('note-list').classList.toggle('hidden', searching || view !== 'notes');
  $('task-list').classList.toggle('hidden', searching || view !== 'tasks');
  $('bookmark-list').classList.toggle('hidden', searching || view !== 'bookmarks');
  $('new-note').classList.toggle('hidden', searching || view !== 'notes');
  $('new-task').classList.toggle('hidden', searching || view !== 'tasks');
  $('new-bookmark').classList.toggle('hidden', searching || view !== 'bookmarks');
}

// 把命中的搜索词标黄。
// 顺序必须是「先转义、再插标签」：反过来的话，笔记里写 <script> 之类
// 的内容会先变成标签再被当成 HTML，一条笔记就能执行脚本。
// 用 split/join 而不是 replace，避免用户搜的词里带正则特殊字符时出错。
function mark(text, keyword) {
  const safe = esc(text || '');
  if (!keyword) return safe;
  const kw = esc(keyword);
  if (!kw) return safe;
  return safe.split(kw).join(`<mark>${kw}</mark>`);
}

function renderSearchResults(keyword, data) {
  const rNotes = data.notes || [];
  const rTasks = data.tasks || [];
  const rMarks = data.bookmarks || [];
  const total = rNotes.length + rTasks.length + rMarks.length;

  const count = (n, name) => (n ? `　${name} ${n}` : '');
  let html = `<div id="search-summary">搜索「<b>${esc(keyword)}</b>」　共 ${total} 条` +
             `${count(rNotes.length, '笔记')}${count(rTasks.length, '任务')}` +
             `${count(rMarks.length, '收藏')}</div>`;

  if (total === 0) {
    html += `<div class="empty">${EMPTY_ICON}<p>笔记、任务和收藏里都没有「${esc(keyword)}」</p></div>`;
    searchResultsEl.innerHTML = html;
    return;
  }

  if (rNotes.length) {
    html += `<div class="result-head"><b>笔记</b></div>`;
    html += rNotes.map((n) => `
      <div class="item result-item" data-kind="note" data-id="${n.id}">
        <div class="item-head">
          <span class="t">${mark(listTitle(n.title), keyword)}</span>
          <span class="kind-tag">笔记</span>
        </div>
        <div class="snippet">${mark(plainText(n.body, 120), keyword)}</div>
      </div>`).join('');
  }

  if (rTasks.length) {
    html += `<div class="result-head"><b>任务</b></div>`;
    html += rTasks.map((t) => {
      const isDone = t.status === 'done';
      const due = isDone ? null : dueLabel(t.due_date);
      const dueHtml = due ? `<span class="due ${due.cls}">${esc(due.text)}</span>` : '';
      return `
      <div class="item result-item task-item ${isDone ? 'done' : ''}" data-kind="task" data-id="${t.id}">
        <div class="item-head">
          <span class="t">${mark(listTitle(t.title), keyword)}</span>
          <span class="kind-tag task">任务</span>
        </div>
        ${dueHtml}
      </div>`;
    }).join('');
  }

  if (rMarks.length) {
    html += `<div class="result-head"><b>收藏</b></div>`;
    html += rMarks.map((b) => {
      const sum = bmSummary(b, keyword);
      return `
      <div class="item result-item bm-item" data-kind="bookmark" data-id="${b.id}">
        <div class="item-head">
          <span class="t">${mark(listTitle(b.title, b.url), keyword)}</span>
          <span class="kind-tag bm">收藏</span>
        </div>
        <div class="bm-host-line">${mark(b.url, keyword)}</div>
        ${sum ? `<div class="bm-host-line bm-sum-line">${sum}</div>` : ''}
        ${bmFailLine(b)}
      </div>`;
    }).join('');
  }
  searchResultsEl.innerHTML = html;
}

// 搜索入口。搜索框为空 = 退出搜索模式，回到当前视图的正常列表。
async function runSearch(keyword) {
  const s = keyword.trim();
  // 搜索框的值就是「搜索模式」的唯一依据。
  // 必须先把输入框改到位，再让 syncListVisibility 去判断，否则会按旧的值判断。
  if (keyword !== searchEl.value) searchEl.value = keyword;
  if (!s) {
    syncListVisibility();          // 退出搜索模式，隐藏搜索结果面板
    await reloadCurrentView();
    return;
  }
  syncListVisibility();
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(s)}`);
    hideBanner();
    renderSearchResults(s, data);
  } catch (e) {
    // 只在真的是「服务连不上」时才说连不上。
    // 以前这里不管抛的是什么错，一律显示「连不上工作台服务」——
    // 结果自己代码里一个变量名写错（ReferenceError）也被说成网络故障，
    // 排查方向当场就跑偏了。先把真错误打进控制台，再按类型分开说。
    console.error('统一搜索失败：', e);
    const offline = e.message === '连不上工作台服务';
    searchResultsEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 9.5 12 3l7.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/>
          <path d="M12 9v4M12 16.5v.01"/>
        </svg>
        <p>${offline
          ? '连不上工作台服务，搜不了。请确认黑色命令行窗口还开着。'
          : `搜索出错：${esc(e.message)}`}</p>
      </div>`;
    showBanner(offline ? '连不上工作台服务。' : `搜索出错：${e.message}`);
  }
}

// 点搜索结果 → 切到它所属的视图并打开
// 三种类型各写一个 if 也不长，但下面这张表更省事：
// 加第四种东西时，这里加一行就够了，撤销和搜索跳转都自动能用。
const KIND = {
  note:     { view: 'notes',     reload: () => loadList() },
  task:     { view: 'tasks',     reload: () => loadTasks() },
  bookmark: { view: 'bookmarks', reload: () => loadBookmarks() },
};

searchResultsEl.addEventListener('click', async (e) => {
  const item = e.target.closest('.item');
  if (!item) return;
  const k = KIND[item.dataset.kind];
  if (!k) return;
  const id = Number(item.dataset.id);
  // setView 会清空搜索框（也就是退出搜索模式），所以要等它把列表加载完再打开
  await setView(k.view);
  if (item.dataset.kind === 'bookmark') openBookmark(id);
  else if (item.dataset.kind === 'task') openTask(id);
  else openNote(id);
});

// ============ 视图切换（笔记 / 任务） ============
// 切之前一定要把当前视图没存完的内容补存一次，
// 否则「刚打了一半标题就切走」会丢掉最后那 800ms 的输入。
let view = 'notes';

async function flushSaves() {
  const jobs = [];
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; jobs.push(saveNow()); }
  if (taskSaveTimer) { clearTimeout(taskSaveTimer); taskSaveTimer = null; jobs.push(saveTaskNow()); }
  if (bookmarkSaveTimer) { clearTimeout(bookmarkSaveTimer); bookmarkSaveTimer = null; jobs.push(saveBookmarkNow()); }
  await Promise.all(jobs);
}

async function setView(v) {
  const changed = v !== view;
  const searching = inSearchMode();
  // 已经在目标视图、也没在搜索 —— 什么都不用做（点当前这个标签就是这么个情况）
  if (!changed && !searching) return;

  if (changed) {
    await flushSaves();      // 等补存完成再切，免得两个列表的请求交叉
    view = v;
    // 必须用 classList 增删（见坑 #7）：直接赋 className 会把 hidden 一起抹掉
    document.querySelectorAll('#view-switch button').forEach((b) =>
      b.classList.toggle('on', b.dataset.view === v));
    $('editor').classList.toggle('hidden', v !== 'notes');
    $('task-pane').classList.toggle('hidden', v !== 'tasks');
    $('bookmark-pane').classList.toggle('hidden', v !== 'bookmarks');
    searchEl.placeholder =
      v === 'notes' ? '搜索标题和正文…' :
      v === 'tasks' ? '搜索任务标题…' : '搜索收藏标题和链接…';
    renderHints();
    hideToast();
  }

  // 清掉搜索词就是退出搜索模式。所以哪怕视图没变（从搜索结果点回同类的条目），
  // 这里也必须往下走，把搜索结果面板换成正常列表。
  // 换视图时清空是有意的：搜笔记的词留到任务页，只会让人以为笔记丢了。
  searchEl.value = '';
  syncListVisibility();
  // 这里要 await：搜索结果点进来时，拿到 id 之后马上要 openNote/openTask，
  // 列表必须已经加载好了，否则 find 不到这条、编辑器不会打开。
  await reloadCurrentView();
}

// 按当前视图刷新该列表。以后再加视图，只改这一处就够了。
function reloadCurrentView() {
  return view === 'bookmarks' ? loadBookmarks()
       : view === 'tasks' ? loadTasks()
       : loadList();
}

document.querySelectorAll('#view-switch button').forEach((b) => {
  b.addEventListener('click', () => setView(b.dataset.view));
});

// 底部快捷键提示会随视图变，不然会提示「新建笔记」但你在任务页
const HINTS = {
  notes: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 新建　<kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索<br>' +
         '<kbd>Ctrl</kbd>+<kbd>S</kbd> 保存　<kbd>Esc</kbd> 关闭',
  tasks: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 新建　<kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索<br>' +
         '<kbd>Ctrl</kbd>+<kbd>S</kbd> 保存　<kbd>Esc</kbd> 关闭',
  bookmarks: '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 新建　<kbd>Ctrl</kbd>+<kbd>K</kbd> 搜索<br>' +
         '<kbd>Ctrl</kbd>+<kbd>S</kbd> 保存　<kbd>Esc</kbd> 关闭',
};
function renderHints() { $('hints').innerHTML = HINTS[view]; }

// ============ 键盘快捷键 ============
// 注意：Ctrl+N（浏览器新窗口）和 Ctrl+F（浏览器查找）是 Chrome 的保留键，
// 网页拦不住，press 了也没用。所以这里换成一组网页能真正拦截的组合：
//   Ctrl+Enter  新建笔记
//   Ctrl+K      聚焦搜索框
//   Ctrl+S      立刻保存
//   Esc         逐层退出（取消删除确认 → 清空搜索 → 关闭编辑器）
document.addEventListener('keydown', (e) => {
  // Esc 按「最紧急 → 最不紧急」的顺序一层层退，避免一下全关了
  if (e.key === 'Escape') {
    if (bookmarkConfirmArmed) { bookmarkDisarmDelete(); return; }
    if (taskConfirmArmed) { taskDisarmDelete(); return; }
    if (confirmArmed) { disarmDelete(); return; }
    if (!$('toast').classList.contains('hidden')) { hideToast(); return; }
    if (searchEl.value) { searchEl.value = ''; runSearch(''); searchEl.blur(); return; }
    if (view === 'bookmarks') { if (currentBookmarkId !== null) closeBookmarkEditor(); return; }
    if (view === 'tasks') { if (currentTaskId !== null) closeTaskEditor(); return; }
    if (currentId !== null) { closeEditor(); }
    return;
  }

  if (!(e.ctrlKey || e.metaKey)) return;   // mac 上是 Cmd，这里一起支持

  if (e.key === 'Enter') {                // 新建：跟着当前视图走
    e.preventDefault();
    if (view === 'bookmarks') openNewBookmark();
    else if (view === 'tasks') createTask();
    else createNote();
  } else if (e.key === 'k' || e.key === 'K') {   // 搜索
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  } else if (e.key === 'b' || e.key === 'B') {   // 粗体（只在笔记视图有意义）
    if (view !== 'notes') return;
    e.preventDefault();
    wrap('**', '**', '粗体');
  } else if (e.key === 'i' || e.key === 'I') {   // 斜体
    if (view !== 'notes') return;
    e.preventDefault();
    wrap('*', '*', '斜体');
  } else if (e.key === 's' || e.key === 'S') {   // 保存
    e.preventDefault();
    if (view === 'bookmarks') {
      if (bookmarkSaveTimer || currentBookmarkId !== null) {
        clearTimeout(bookmarkSaveTimer);   // 取消待执行的自动保存，现在就存
        bookmarkSaveTimer = null;
        saveBookmarkNow();
      }
    } else if (view === 'tasks') {
      if (currentTaskId !== null) {
        clearTimeout(taskSaveTimer);
        taskSaveTimer = null;
        saveTaskNow();
      }
    } else if (currentId !== null) {
      clearTimeout(saveTimer);
      saveTimer = null;
      saveNow();
    }
  }
});

// 页面关闭前把没存完的内容补存一次；
// 如果上次保存失败过，就拦一下，别让用户稀里糊涂丢掉内容。
window.addEventListener('beforeunload', (e) => {
  flushSaves();
  if (saveFailed || taskSaveFailed || bookmarkSaveFailed) {
    e.preventDefault();
    e.returnValue = '';        // 浏览器会弹出「确认离开」提示
  }
});

// ============ v3：AI 设置 ============
// 这一段只做配置，不做调用。问 AI 的功能是下一步的事。
//
// 一条重要前提：**浏览器里的任何东西用户都能在控制台里看到**。
// 所以后端永远不回传完整密钥，这里也就永远拿不到它 —— 只能显示
// 「已保存 sk-a****7890」这样的打码结果。改密钥只能整份重贴，没有「读取旧值」这回事。

let aiCatalog = null;   // 服务商目录，取一次就缓存

function aiFootMsg(text, kind = '') {
  const el = $('ai-foot-msg');
  el.textContent = text;
  el.className = 'ai-foot-msg' + (kind ? ' ' + kind : '');
}

// 切换服务商时刷新下半部分：模型建议、说明文字、去哪拿 key。
// 模型名不跟着服务商一起清空 —— 用户可能刚填了个自定义模型名，
// 换个服务商看一眼再换回来，名字被冲掉就只能重打了。
// 探测结果也一起清掉：那是**上一家**的模型，留着会误导。
function aiOnProviderChange() {
  const p = aiCatalog?.providers.find(x => x.id === $('ai-provider').value);
  if (!p) return;

  // 建议模型做成 datalist（下拉建议），但输入框仍然可以自由填
  $('ai-model-options').innerHTML = p.models
    .map(m => `<option value="${esc(m.id)}">${esc(m.note || m.id)}</option>`).join('');
  $('ai-model-hint').textContent = p.modelHint
    || (p.models.length ? '可以直接选下面的，也可以手填别的名字。' : '');

  aiClearDetected();

  const bits = [];
  if (p.note) bits.push(p.note);
  if (p.retired) bits.push('注意：' + p.retired);
  bits.push(`接口地址 <code>${esc(p.base_url)}</code>`);
  $('ai-pv-note').innerHTML = bits.join('<br>');
  $('ai-key-hint').innerHTML = `没有密钥？去 <a href="${esc(p.key_url)}" target="_blank" rel="noopener noreferrer">${esc(p.name)}控制台</a> 申请。`;
}

// ---- 检测可用模型 ----
// 为什么要这个按钮：厂商改模型名太频繁（DeepSeek 2026-09-10 刚把
// deepseek-v4-flash 改成 deepseek-flash）。目录里写死一份名单必然会有过时的一天，
// 与其维护它，不如直接问服务商要一份现在的。
// 它不花钱（只列名字，不对话）、不带笔记内容，密钥也不落盘。
let aiDetected = { models: [], all: [], showAll: false };

function aiClearDetected() {
  aiDetected = { models: [], all: [], showAll: false };
  $('ai-detect-box').classList.add('hidden');
  $('ai-detect-list').innerHTML = '';
}

// 把检测结果画成一堆可点的标签。当前填着的那个高亮，方便在一堆里认出来。
function aiRenderDetected() {
  const box = $('ai-detect-box');
  const list = aiDetected.showAll ? aiDetected.all : aiDetected.models;
  const cur = $('ai-model').value.trim();

  $('ai-detect-list').innerHTML = list.length
    ? list.map(m => `<button type="button" class="ai-chip${m === cur ? ' current' : ''}" data-m="${esc(m)}">${esc(m)}</button>`).join('')
    : '';
  // 一条都没有就整个藏起来：空盒子看着像出错了
  box.classList.toggle('hidden', !list.length);
  $('ai-show-all').classList.toggle('hidden', !aiDetected.all.length || aiDetected.all.length === aiDetected.models.length);
}

async function aiDetectModels() {
  const btn = $('ai-detect');
  const box = $('ai-detect-box');
  btn.classList.add('loading');
  aiClearDetected();

  try {
    // 密钥取输入框里的；留空就用后端已保存的那个。
    // 探测**不会保存**这次输入的密钥 —— 试一下不等于存下来。
    const body = { provider: $('ai-provider').value };
    const typed = $('ai-key').value.trim();
    if (typed) body.api_key = typed;

    const r = await api('/api/ai/models', { method: 'POST', body: JSON.stringify(body) });

    if (!r.ok) {
      box.classList.remove('hidden');
      $('ai-detect-list').innerHTML = `<p class="ai-detect-err">${esc(r.error || '检测失败')}</p>`;
      $('ai-detect-summary').textContent = '';
      return;
    }
    aiDetected = { models: r.models || [], all: r.all_models || r.models || [], showAll: false };
    $('ai-detect-summary').textContent =
      `找到 ${r.total} 个模型${r.filtered ? `，其中 ${r.filtered} 个不像是对话用的，先藏起来了` : ''}：`;
    aiRenderDetected();

    // 一个都没探测出来才算失败；有结果就直接把第一个填上，省一次手点。
    // 但只在**输入框还是空的**时候才自动填 —— 不覆盖用户已经敲进去的东西。
    if (aiDetected.models.length && !$('ai-model').value.trim()) {
      $('ai-model').value = aiDetected.models[0];
      aiRenderDetected();
    }
  } catch (e) {
    box.classList.remove('hidden');
    $('ai-detect-list').innerHTML = `<p class="ai-detect-err">${esc(e.message)}</p>`;
  } finally {
    btn.classList.remove('loading');
  }
}

$('ai-detect').addEventListener('click', aiDetectModels);
$('ai-show-all').addEventListener('click', () => { aiDetected.showAll = true; aiRenderDetected(); });
$('ai-detect-list').addEventListener('click', (e) => {
  const chip = e.target.closest('.ai-chip');
  if (!chip) return;
  $('ai-model').value = chip.dataset.m;
  aiRenderDetected();
});
// 手改输入框时，同步一下哪个标签是高亮的
$('ai-model').addEventListener('input', () => {
  if (!$('ai-detect-box').classList.contains('hidden')) aiRenderDetected();
});

async function openAiDialog() {
  $('ai-backdrop').classList.remove('hidden');
  $('ai-key').value = '';                 // 每次打开都是空的，不回填旧密钥
  aiFootMsg('');
  try {
    const data = await api('/api/ai/config');
    aiCatalog = data;
    const cfg = data.config;

    $('ai-provider').innerHTML = data.providers
      .map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    $('ai-provider').value = cfg.provider || data.providers[0].id;
    $('ai-model').value = cfg.model || '';
    aiOnProviderChange();

    // 已存了 key 就明确说清楚，别让人以为没保存上而白贴一次
    $('ai-key-state').innerHTML = cfg.has_key
      ? `已保存密钥 <b>${esc(cfg.key_preview)}</b>。留空这一栏就是不改它。`
      : '还没保存过密钥。';

    $('ai-pending-box').innerHTML = data.pending.length
      ? `<div class="ai-pending">暂时用不了：${data.pending
          .map(p => `<b>${esc(p.name)}</b> — ${esc(p.why)}`).join('；')}。</div>`
      : '';

    updateAiDot(cfg);
    $('ai-save').focus();
  } catch (e) {
    aiFootMsg('读不到配置：' + e.message, 'err');
  }
}

function closeAiDialog() {
  $('ai-backdrop').classList.add('hidden');
  $('ai-key').value = '';      // 关掉就把输入框里那个明文清掉，不留在 DOM 里
  aiClearDetected();
  aiFootMsg('');
}

// 顶栏按钮上的小圆点：绿点 = 配置齐了，可以问。
// 没配就灰着，让「为什么还不能用」一眼看得见。
function updateAiDot(cfg) {
  const d = $('ai-dot');
  if (!d) return;
  d.classList.toggle('on', !!(cfg && cfg.ready));
  $('ai-btn').title = cfg && cfg.ready
    ? `AI 已就绪：${cfg.provider} · ${cfg.model}`
    : '设置 AI 服务商和模型（还没配好）';
}

$('ai-btn').addEventListener('click', openAiDialog);
$('ai-cancel').addEventListener('click', closeAiDialog);
// 点背景空白处关闭（点到弹窗本体不关，不然选文字时会误关）
$('ai-backdrop').addEventListener('mousedown', (e) => {
  if (e.target === $('ai-backdrop')) closeAiDialog();
});

$('ai-provider').addEventListener('change', aiOnProviderChange);

$('ai-key-toggle').addEventListener('click', () => {
  const inp = $('ai-key');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  $('ai-key-toggle').textContent = show ? '隐藏' : '显示';
});

$('ai-save').addEventListener('click', async () => {
  const provider = $('ai-provider').value;
  const model = $('ai-model').value.trim();
  const key = $('ai-key').value.trim();

  // 这两条在提交前就拦掉，省得发一次请求再回来报同样的错
  if (!model) return aiFootMsg('模型名不能空', 'err');
  if (!key && !$('ai-key-state').textContent.includes('已保存')) {
    return aiFootMsg('还没填密钥。第一次用要先填', 'err');
  }
  aiFootMsg('保存中…');
  try {
    // key 只在用户真的输入了新值时才带上。不带 = 保留后端原来那个。
    const body = { provider, model };
    if (key) body.api_key = key;
    const r = await api('/api/ai/config', { method: 'PUT', body: JSON.stringify(body) });
    updateAiDot(r.config);
    aiFootMsg('已保存', 'ok');
    setTimeout(closeAiDialog, 450);
  } catch (e) {
    aiFootMsg(e.message, 'err');
  }
});

// 「全部清除」要防手滑 —— 一次点击就把密钥和服务商都清掉，代价不小
let aiResetArmed = false;
$('ai-reset').addEventListener('click', async () => {
  if (!aiResetArmed) {
    aiResetArmed = true;
    aiFootMsg('再点一次就真的清掉了（密钥会从磁盘上删掉）', 'err');
    setTimeout(() => { aiResetArmed = false; }, 4000);
    return;
  }
  try {
    const r = await api('/api/ai/config', { method: 'PUT', body: JSON.stringify({ reset: true }) });
    updateAiDot(r.config);
    closeAiDialog();
  } catch (e) {
    aiFootMsg(e.message, 'err');
  }
});

// Esc 优先关弹窗：它是当前最上层的东西
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('ai-backdrop').classList.contains('hidden')) closeAiDialog();
}, true);   // capture：要在页面自己那个 Esc 处理之前跑

// ============ 启动 ============
setMode(mode);
renderHints();
reloadCurrentView();
// 静默读一次配置，只为顶栏那个小圆点。读不到就算了，不打扰用户。
api('/api/ai/config').then(d => { aiCatalog = d; updateAiDot(d.config); }).catch(() => {});
</script>
</body>
</html>
